Cambridge Official Author", "skill": "Grammar & Accuracy", "title": "The Common Mistakes at IELTS: How Examiners Spot Prepared Answers", "yt_id": "e_z4k4J5bQE", "url": "https://www.youtube.com/watch?v=e_z4k4J5bQE", "duration": "20 mins", "desc": "Why memorized templates like 'In this modern era' are penalized by examiners, and how to use natural academic phrasing instead.", "weekCorrelation": 1, "discussionFocus": "Transforming rote memorization into flexible syntactic structures using clefting, conditionals, and passive reporting."}, {"id": "fm-10", "teacher": "Alex (E2 IELTS)", "channel": "E2 IELTS (Australia)", "badge": "General Training Specialist", "skill": "Task 1 Letters", "title": "General Training Task 1: Formal vs Semi-Formal vs Informal Letters", "yt_id": "X4o3u4p_E14", "url": "https://www.youtube.com/watch?v=X4o3u4p_E14", "duration": "23 mins", "desc": "Tone calibration across 10 letter scenarios (manager vs neighbor vs friend) and signing off rules (Yours sincerely vs Yours faithfully).", "weekCorrelation": 4, "discussionFocus": "The 10-point recipient matrix from our course: Why an exclamation mark to a manager drops your register score immediately."}], "weeklySlides": {"0": [{"slideNumber": 1, "title": "Welcome & Course Architecture", "subtitle": "Summer Master Round: From Diagnostic to Band 8.5", "category": "Orientation", "content": "<ul><li><strong>Target Objective:</strong> Equipping candidates for high-stakes Band 7.5 - 8.5 Academic & General IELTS scores.</li><li><strong>Curriculum Duration:</strong> 7 Intensive Weeks covering all 4 exam skills with mathematical scoring breakdowns.</li><li><strong>The 24/7 Support Ecosystem:</strong> Daily WhatsApp cadence, LMS submissions, private examiner mock appointments, and Saturday IELTS Clinics.</li></ul>", "discussionTopic": "What is your specific target band for your visa or academic admission, and which of the 4 skills represents your biggest historical bottleneck?", "formula": "Diagnostic Baseline + 7 Weeks Deliberate Practice = Band 8.0+", "teacherNote": "The honeymoon period ends today. Total commitment is required from Friday onwards.", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "الجدول الزمني الشامل للمحاضرات ومواعيد الامتحانات والعيادات"}}, {"slideNumber": 2, "title": "The 4 Skills Mathematical Breakdown", "subtitle": "Raw Score Conversion & Scoring Calibration", "category": "Exam Mechanics", "content": "<ul><li><strong>Listening (40 Questions):</strong> 30/40 = Band 7.0 | 35/40 = Band 8.0 | 39-40 = Band 9.0. (Speed 1.25x training requirement).</li><li><strong>Reading Academic (40 Questions):</strong> 30/40 = Band 7.0 | 35/40 = Band 8.0. Strict 60-minute cutoff with ZERO transfer time.</li><li><strong>Writing (Task 1: 33% | Task 2: 67%):</strong> Task 2 carries double the weight of Task 1. Finish Task 1 in 18 mins, Task 2 in 37 mins, leaving 5 mins for PSTA proofreading.</li><li><strong>Speaking (11-14 Minutes):</strong> 4 equal criteria (25% each): Fluency & Coherence, Lexical Resource, Grammatical Range, Pronunciation.</li></ul>", "discussionTopic": "Why does spending 30 minutes on Writing Task 1 mathematically sabotage your overall Writing band?", "formula": "Overall Band = (L + R + W + S) / 4 (Rounded up at .25 and .75 boundaries)", "teacherNote": "Understand that Writing Task 2 is 66.6% of your writing score. Master Task 2 first!", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "سياسات الغياب والتعويض والحضور الإلزامي"}}, {"slideNumber": 3, "title": "The 24/7 WhatsApp Protocol & Study Cadence", "subtitle": "Structuring Your Daily Deliberate Practice", "category": "Cadence", "content": "<ul><li><strong>08:00 AM - 10:00 AM:</strong> Morning Lexical Trigger (Academic Word List & Band 8 Idioms posted).</li><li><strong>02:00 PM - 04:00 PM:</strong> Daily Micro-Task (Timed listening section or 1-minute cue card voice note).</li><li><strong>08:00 PM - 10:00 PM:</strong> Evening Essay Correction Dispatch (Open feedback on laptop, never on phone!).</li><li><strong>Saturday Enrichment:</strong> 01:00 PM - 02:30 PM: IELTS Clinic for Band 5.0 - 5.5 structural remediation.</li></ul>", "discussionTopic": "How to organize your personal study timetable around the daily WhatsApp triggers to avoid cramming.", "formula": "Consistency > Intensity: 90 Minutes Daily > 10 Hours Once a Week", "teacherNote": "Always review essay corrections on a laptop with Microsoft Word track changes enabled.", "primaryFile": {"name": "Expected Speaking Questions Booklet Final-1.pdf", "path": "Expected Speaking Questions Booklet Final-1.pdf", "type": "PDF", "size": "2.05 MB", "desc": "كتيب أسئلة وموضوعات التحدث المعتمد (51 صفحة)"}}, {"slideNumber": 4, "title": "LMS Setup & Essential Resource Inventory", "subtitle": "Your Digital Arsenal for Band 8.0", "category": "Tooling", "content": "<ul><li><strong>Cambridge IELTS 15-18:</strong> The only authentic test source for listening and reading simulations.</li><li><strong>The 51-Page Speaking Booklet:</strong> Expected questions bank covering 100+ topics with model answers.</li><li><strong>'My Mistakes and Proud' Journal:</strong> Mandatory logbook where every corrected grammar error is recorded.</li><li><strong>Botim / IMO / WhatsApp Private Service:</strong> Private scheduling for speaking exams with certified examiners.</li></ul>", "discussionTopic": "Setting up your 'My Mistakes and Proud' notebook: Categorizing your errors into SVA, Articles, and Prepositions.", "formula": "LMS + Cambridge Official + Speaking Booklet + Mistake Log = Success", "teacherNote": "Joining the LMS is urgent. Contact support immediately if your credentials are not active.", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "خطة التدريب اليومية (6 ساعات) والمتابعة عبر المنصة"}}, {"slideNumber": 5, "title": "Week 0 Live Workshop & Discussion Agenda", "subtitle": "Setting the Psychological Baseline", "category": "Live Workshop", "content": "<ul><li><strong>Roundtable Introductions:</strong> Candidates share their academic/career destinations (Canada Express Entry, UK PLAB, Australia PR, Erasmus).</li><li><strong>Diagnostic Test Audit:</strong> Analyzing the initial placement test results and identifying the weakest link.</li><li><strong>Commitment Contract:</strong> Agreeing to the 24-hour turnaround policy for essay submissions.</li></ul>", "discussionTopic": "Overcoming test anxiety: Why thinking in your native language causes 80% of speaking hesitations.", "formula": "Mindset: View IELTS as an English communication test, not an academic barrier.", "teacherNote": "Encourage students who scored 5.0 on the diagnostic: Band 5 is a normal starting point.", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "جدول الحصص التفاعلية ومواعيد المحاكاة الشاملة"}}], "1": [{"slideNumber": 1, "title": "The 5 Pillars to Band 8.0", "subtitle": "The Foundation of Every High-Scoring Candidate", "category": "Core Fundamentals", "content": "<ul><li><strong>Pillar 1: Cognitive Fluency:</strong> Ideas generation without hesitation (CHIPSET & WHTFM).</li><li><strong>Pillar 2: Syntactic Complexity:</strong> Balancing simple, compound, complex, and cleft sentences.</li><li><strong>Pillar 3: Lexical Precision:</strong> Using topic-specific academic vocabulary and collocations, avoiding generic terms.</li><li><strong>Pillar 4: Grammatical Accuracy:</strong> Eradication of the 7 fatal grammar mistakes ('Cancer of IELTS').</li><li><strong>Pillar 5: Cohesive Architecture:</strong> Flawless paragraph transitions using TEXS and BRO.</li></ul>", "discussionTopic": "Why does memorizing generic templates (e.g. 'In this day and age, opinions are divided...') trigger an automatic examiner penalty?", "formula": "5 Pillars = Fluency + Syntax + Lexis + Zero Cancer Grammar + Cohesion", "teacherNote": "Explain that examiners are trained to spot memorized chunks within 10 seconds.", "primaryFile": {"name": "Week 1 Study Plan 1.14.5.24.1.pdf", "path": "Week 1/Week 1 Study Plan 1.14.5.24.1.pdf", "type": "PDF", "size": "458 KB", "desc": "الخطة الدراسية التفصيلية للأسبوع الأول والمهام اليومية"}}, {"slideNumber": 2, "title": "Computer-Delivered vs Paper-Based IELTS", "subtitle": "Tactical Comparison & Choosing Your Weapon", "category": "Exam Format", "content": "<ul><li><strong>Typing Speed vs Handwriting:</strong> On computer, you have live word count (prevents <250 word penalty) and instant cut-copy-paste.</li><li><strong>Reading Navigation:</strong> Computer split-screen shows text on the left and questions on the right. You can highlight and take digital notes.</li><li><strong>Listening Logistics:</strong> Computer test gives only 2 minutes at the end to check answers (vs 10 minutes transfer time on paper). Headphones with individual volume control.</li><li><strong>Results Speed:</strong> Computer: 3-5 days. Paper: 13 calendar days.</li></ul>", "discussionTopic": "Debate: If you type at less than 35 WPM, should you opt for Paper-based or practice typing to reap computer benefits?", "formula": "Fast Typer (>40 WPM) -> Computer Test | Neat Penmanship -> Paper Test", "teacherNote": "Advise students who have messy handwriting to strictly take the computer-delivered exam.", "primaryFile": {"name": "Week one. Wednesdays session .pdf", "path": "Week 1/Week one. Wednesdays session .pdf", "type": "PDF", "size": "1.2 MB", "desc": "شرح الركائز الخمس للأسبوع الأول وجمل Cleft"}}, {"slideNumber": 3, "title": "The 'Cancer of IELTS': 7 Fatal Grammar Mistakes", "subtitle": "The Errors That Immediately Cap GRA at Band 5.0", "category": "Grammar Eradication", "content": "<ul><li><strong>1. Subject-Verb Agreement:</strong> 'The criteria is' vs 'The criteria are'; 'The number of people IS'.</li><li><strong>2. Comma Splice:</strong> Joining independent clauses with a comma without a conjunction.</li><li><strong>3. Sentence Fragments:</strong> Subordinate clauses left standing alone without an independent clause.</li><li><strong>4. Tense Shifting:</strong> Randomly jumping between past and present when narrating or describing historical graphs.</li><li><strong>5. Article Omission:</strong> Leaving singular countable nouns naked without a/an/the.</li><li><strong>6. Pluralizing Non-counts:</strong> 'Informations', 'Advices', 'Researches'.</li><li><strong>7. Preposition Collocations:</strong> 'Discuss about', 'Responsible of'.</li></ul>", "discussionTopic": "Live Audit: Identify the fatal grammar mistake in 5 sample candidate sentences from the whiteboard.", "formula": "GRA Scoring: 0-1 Minor Slips = Band 8 | Systematic Slips = Band 6 | Basic Slips = Band 5", "teacherNote": "Every student must write these 7 rules on the inside cover of their notebook.", "primaryFile": {"name": "Week one. Wednesdays session .pdf", "path": "Week 1/Week one. Wednesdays session .pdf", "type": "PDF", "size": "1.2 MB", "desc": "الأخطاء القاتلة السبعة في القواعد ومصفوفة التصحيح الفوري"}}, {"slideNumber": 4, "title": "Academic Sentence Variety & Cleft Structures", "subtitle": "Elevating Syntactic Range to Band 8+", "category": "Advanced Syntax", "content": "<ul><li><strong>Simple & Compound:</strong> Use coordinating conjunctions (FANBOYS) for crisp foundational thoughts.</li><li><strong>Complex Sentences:</strong> Adverbial, relative, and noun clauses ('Whilst some argue that X, evidence suggests Y').</li><li><strong>Cleft Sentences (The Band 8 Weapon):</strong> 'What can be said is that...', 'What matters most is...', 'It is through education that...'.</li><li><strong>Inversion for Emphasis:</strong> 'Not only is parental discipline pivotal, but it is also essential for emotional stability.'</li></ul>", "discussionTopic": "Transforming 3 simple sentences into a single Band 8.5 compound-complex sentence with an embedded cleft structure.", "formula": "Syntax Target: 50% Complex + 30% Compound + 10% Simple + 10% Inverted/Cleft", "teacherNote": "Practice cleft sentences in both writing and speaking Part 3.", "primaryFile": {"name": "Week one. Wednesdays session .pdf", "path": "Week 1/Week one. Wednesdays session .pdf", "type": "PDF", "size": "1.2 MB", "desc": "صيغ الجمل المعقدة: Cleft Sentences و Inversion لدرجة Band 8"}}, {"slideNumber": 5, "title": "Week 1 Live Session Discussion Agenda", "subtitle": "Wednesday Live Workshop: Grammar Clinic & Baseline Surgery", "category": "Live Workshop", "content": "<ul><li><strong>Live Diagnostic Surgery:</strong> Deconstructing the most frequent student mistakes from the placement essays.</li><li><strong>The Cleft Sentence Drill:</strong> Each student must produce 2 impromptu cleft sentences on economic and educational topics.</li><li><strong>Speaking Examiner Booking Drill:</strong> Explaining how to schedule your Friday/Saturday speaking exam on Botim/WhatsApp.</li><li><strong>First Essay Assignment:</strong> Releasing Task 2 Topic 1 (Parental Education Programs).</li></ul>", "discussionTopic": "Why do students panic when receiving their first Band 5.5 essay score, and how does the Saturday Clinic remediate it?", "formula": "Action Item: Submit Essay 1 before Sunday midnight via LMS.", "teacherNote": "Reassure students: A Band 5.5 on your very first essay is standard. Trust the process.", "primaryFile": {"name": "Expected Speaking Questions Booklet Final-1.pdf", "path": "Expected Speaking Questions Booklet Final-1.pdf", "type": "PDF", "size": "2.05 MB", "desc": "بروتوكول اختبار التحدث والـ 22 موضوعاً الأساسية"}}, {"slideNumber": 6, "title": "Foreign Master Spotlight: Simon Ex-Examiner", "subtitle": "How Examiners Grade GRA & Lexical Resource", "category": "Examiner Insights", "content": "<ul><li><strong>Simon's Golden Rule:</strong> Simple ideas expressed with great grammar beat complicated ideas expressed with messy grammar.</li><li><strong>Band 7 vs Band 8 GRA:</strong> Band 7 allows frequent error-free sentences with occasional slips. Band 8 requires the vast majority of sentences to be error-free.</li><li><strong>Avoid Pompous Vocabulary:</strong> Replacing 'big' with 'gargantuan' or 'happy' with 'over the moon' in academic writing immediately reduces your score for inappropriate register.</li></ul>", "discussionTopic": "Analyze Simon's deconstruction of a Band 6 vs Band 8 paragraph on environmental protection.", "formula": "Precision > Complexity: Clean academic English wins every time.", "teacherNote": "Watch Simon's 19-minute masterclass before drafting your first essay.", "primaryFile": {"name": "Week one. Wednesdays session .pdf", "path": "Week 1/Week one. Wednesdays session .pdf", "type": "PDF", "size": "1.2 MB", "desc": "التدريب العملي لحصة الأربعاء وتطبيقات الجرامر الصوتي"}}], "2": [{"slideNumber": 1, "title": "The 4 Speaking Evaluation Rubrics", "subtitle": "Deconstructing What Examiners Actually Score", "category": "Speaking Strategy", "content": "<ul><li><strong>1. Fluency & Coherence (25%):</strong> Speech rate, length of answers, absence of hesitation fillers ('aaaaa'), natural discourse markers.</li><li><strong>2. Lexical Resource (25%):</strong> Range of vocabulary, idiomatic language (2-3 natural idioms), collocations, avoiding repetition of question prompts.</li><li><strong>3. Grammatical Range & Accuracy (25%):</strong> Tense control, complex sentences, conditional structures, zero systematic SVA errors.</li><li><strong>4. Pronunciation (25%):</strong> Intonation rhythm, sentence stress on keywords, chunking, phonemic clarity (NOT British/American accent!).</li></ul>", "discussionTopic": "Debate: Does having an Arabic accent lower your Pronunciation score? (Examiner answer: No, only intelligibility and word stress count!).", "formula": "Speaking Band = (FC + LR + GRA + PR) / 4", "teacherNote": "Stress to students: Examiners do NOT deduct marks for foreign accents. Intonation and clarity are key.", "primaryFile": {"name": "WEEK 2 STUDY PLAN 02.22.05.1.pdf", "path": "Week 2/WEEK 2 STUDY PLAN 02.22.05.1.pdf", "type": "PDF", "size": "512 KB", "desc": "خطة دراسة الأسبوع الثاني وجدول المقابلات الشفهية"}}, {"slideNumber": 2, "title": "Speaking Part 1 Strategy: The 2-3 Sentences Rule", "subtitle": "Crisp, Natural, Direct Dialogue Mastery", "category": "Speaking Part 1", "content": "<ul><li><strong>The Golden Rule:</strong> Answer in exactly 2 to 3 well-crafted sentences. Never answer with a single word or a 2-minute monologue.</li><li><strong>Sentence 1 (Direct Answer):</strong> Answer the question directly with a paraphrased synonym.</li><li><strong>Sentence 2 (Reason / Detail):</strong> Provide the 'why' using a connector ('Because...', 'Since...', 'Given that...').</li><li><strong>Sentence 3 (Example or Frequency):</strong> Ground it in your personal life ('In fact, I usually...', 'For instance, just last weekend...').</li><li><strong>Never Paraphrase Robotically:</strong> If asked 'Do you like sports?', don't say 'Yes, I like sports'. Say 'To be perfectly honest, I am an ardent fan of basketball...'</li></ul>", "discussionTopic": "Live Pair Practice: 10 Part 1 rapid-fire topics (hometown, sunglasses, chocolate, morning routines) using the 2-3 sentences rule.", "formula": "Part 1 Formula = Direct Paraphrased Answer + Logical Justification + Concrete Frequency/Example", "teacherNote": "Stop students immediately if they ramble into a 4th sentence in Part 1.", "primaryFile": {"name": "Week 2 Wednesdays  session .pdf", "path": "Week 2/Week 2 Wednesdays  session .pdf", "type": "PDF", "size": "1.8 MB", "desc": "معايير تقييم التحدث الأربعة (FC, LR, GRA, PR)"}}, {"slideNumber": 3, "title": "Speaking Part 2: The WHTFM Cue Card Formula", "subtitle": "Sustaining a Fluent 2-Minute Monologue Without Hesitation", "category": "Speaking Part 2", "content": "<ul><li><strong>W - What:</strong> Identify the person, place, object, or event vividly with descriptive adjectives.</li><li><strong>H - How:</strong> Explain the process, how you got involved, or how the event unfolded.</li><li><strong>T - Time:</strong> Establish the exact timeframe, duration, and setting using past tenses.</li><li><strong>F - Feelings:</strong> Express your emotional and psychological state using idiomatic phrases.</li><li><strong>M - Meaning:</strong> Conclude with the personal significance, life lesson, or philosophical takeaway.</li><li><strong>The 1-Minute Note-Taking Trick:</strong> Write keywords vertically (W-H-T-F-M), never write full sentences!</li></ul>", "discussionTopic": "Live Simulation: 1 minute note-taking on 'Describe a time you were extremely busy' followed by 2 minutes of nonstop speech.", "formula": "WHTFM = What + How + Time + Feelings + Meaning", "teacherNote": "If a candidate stops speaking before 1:40, examiners are instructed to sit in silence. You must speak until stopped!", "primaryFile": {"name": "Week 2 Wednesdays  session .pdf", "path": "Week 2/Week 2 Wednesdays  session .pdf", "type": "PDF", "size": "1.8 MB", "desc": "معادلة WHTFM للإجابة التلقائية الممتدة في Part 1"}}, {"slideNumber": 4, "title": "The Golden Idioms Rule: 2-3 Max or Band 5 Penalty", "subtitle": "Using Figurative Language Without Sounding Unnatural", "category": "Lexical Resource", "content": "<ul><li><strong>The Examiner Trap:</strong> Cramming 6+ idioms into a speaking exam sounds rehearsed and unnatural, automatically dropping Lexical Resource to Band 5.0!</li><li><strong>The Safe Target:</strong> Use exactly 2 to 3 well-placed idioms across the entire 14-minute interview.</li><li><strong>High-Yield Idioms from Course Booklet:</strong></li><li>- 'I work around the clock' (Very busy / committed)</li><li>- 'I was up to my ears in work and study' (Overwhelmed)</li><li>- 'It is definitely not my cup of tea' (Dislike)</li><li>- 'Once in a blue moon' (Rarely)</li><li>- 'It was a blessing in disguise' (Turned out beneficial)</li><li><strong>NEVER use idioms in Academic Writing Task 1 or 2! Idioms are strictly for speaking.</strong></li></ul>", "discussionTopic": "Why using 'raining cats and dogs' or 'over the moon' in every response immediately flags you as a memorizer.", "formula": "2-3 Natural Idioms = Band 8 | 0 Idioms = Band 6 | 7+ Forced Idioms = Band 5", "teacherNote": "Keep idioms conversational and contextually appropriate.", "primaryFile": {"name": "Expected Speaking Questions Booklet Final-1.pdf", "path": "Expected Speaking Questions Booklet Final-1.pdf", "type": "PDF", "size": "2.05 MB", "desc": "بطاقات Cue Cards لـ Part 2 وتقسيم دقيقة التحضير"}}, {"slideNumber": 5, "title": "Intonation & Voice Modulation Technique", "subtitle": "'Raise Your Voice with Connectors and Keywords'", "category": "Pronunciation", "content": "<ul><li><strong>Intonation Rhythm:</strong> English is a stress-timed language. Content words are stressed; grammatical function words are reduced.</li><li><strong>The Connector Pitch Rule:</strong> Slightly raise your pitch when launching a discourse connector ('HOWEVER, ...', 'ON THE OTHER HAND, ...', 'ACTUALLY, ...').</li><li><strong>Chunking:</strong> Grouping words into meaningful 3-5 word thought groups rather than speaking word-by-word robotically.</li><li><strong>Eliminating Vocalized Hesitations:</strong> Replace 'aaaa... uhhh...' with natural pausing or filler phrases: 'Well, that's an intriguing question...', 'Let me see...'.</li></ul>", "discussionTopic": "Audio Drill: Choral repetition of a sample Part 3 response, emphasizing pitch rise on connectors.", "formula": "Raise Voice on Connectors + Stress Nouns/Verbs + Smooth Pausing = Band 8 Pronunciation", "teacherNote": "Practice recording your voice on WhatsApp and listening back to catch flat intonation.", "primaryFile": {"name": "Expected Speaking Questions Booklet Final-1.pdf", "path": "Expected Speaking Questions Booklet Final-1.pdf", "type": "PDF", "size": "2.05 MB", "desc": "أسئلة النقاش الفكري المجرد Part 3 ومفردات الرأي الأكاديمي"}}, {"slideNumber": 6, "title": "Speaking Exam Appointments & Botim/IMO Protocol", "subtitle": "The Private Examiner Testing Workflow", "category": "Exam Logistics", "content": "<ul><li><strong>Private Examiner Contact:</strong> On Friday and Saturday, your assigned certified examiner contacts you on WhatsApp to schedule your appointment.</li><li><strong>Answering the Call:</strong> If you miss the call without prior notice, you forfeit that week's speaking evaluation slot.</li><li><strong>During the Phone Exam:</strong> Sit in a quiet room with strong WiFi. Have a paper and pen ready for the 1-minute Part 2 prep.</li><li><strong>Written Diagnostic Feedback:</strong> Sent within 24 hours via WhatsApp detailing scores across all 4 criteria and specific mispronounced words.</li></ul>", "discussionTopic": "How to review examiner voice feedback and record your recurring mispronunciations in 'My Mistakes and Proud'.", "formula": "Private Mock -> Detailed Scoring Rubric -> Targeted Correction -> Progress", "teacherNote": "Never argue with the examiner during the exam. Save questions for the instructor.", "primaryFile": {"name": "Week 2 Wednesdays  session .pdf", "path": "Week 2/Week 2 Wednesdays  session .pdf", "type": "PDF", "size": "1.8 MB", "desc": "بروتوكول اختبارات Botim مع الممتحنين المعتمدين والمحاكاة"}}, {"slideNumber": 7, "title": "Week 2 Live Workshop & Peer Simulation", "subtitle": "Wednesday Live Workshop: The Hot Seat", "category": "Live Workshop", "content": "<ul><li><strong>The Hot Seat Exercise:</strong> 3 candidates take the virtual hot seat for a live Part 1 and Part 2 simulation in front of the group.</li><li><strong>Peer Marking:</strong> Classmates evaluate the hot seat candidate against the 4 rubrics using an anonymous poll.</li><li><strong>Keith O'Hare Video Analysis:</strong> Breaking down Keith's masterclass on natural discourse markers.</li><li><strong>Writing Assignment Reminder:</strong> Submit Essay 2 (Technology & Family Dynamics) before Sunday.</li></ul>", "discussionTopic": "Candidate debrief: How did it feel being put on the spot, and how did WHTFM help prevent mental blocks?", "formula": "Hot Seat Pressure + Peer Critique = Elimination of Stage Fright", "teacherNote": "Applaud courage: Practicing mistakes in front of peers builds unshakeable exam confidence.", "primaryFile": {"name": "Week 2 Wednesdays  session .pdf", "path": "Week 2/Week 2 Wednesdays  session .pdf", "type": "PDF", "size": "1.8 MB", "desc": "ورشة العمل المباشرة والتحليل الصوتي للطلاقة"}}], "3": [{"slideNumber": 1, "title": "Writing Task 2 Discursive Architecture", "subtitle": "Mastering the 4 Criteria for 66.7% of Your Writing Score", "category": "Writing Task 2", "content": "<ul><li><strong>Task Response (25%):</strong> Addressing ALL parts of the prompt, maintaining a clear position throughout, and fully extending main ideas.</li><li><strong>Coherence & Cohesion (25%):</strong> Logical paragraph sequencing, one central topic per paragraph, flexible linking devices without mechanical over-linking.</li><li><strong>Lexical Resource (25%):</strong> Wide academic vocabulary, precise collocations, rare minor spelling slips.</li><li><strong>Grammatical Range & Accuracy (25%):</strong> Majority of error-free sentences, complex syntactic structures, accurate punctuation.</li><li><strong>Word Count Constraint:</strong> Minimum 250 words. Ideal target: 265 - 285 words. (Under 250 words = automatic Band 5 penalty!).</li></ul>", "discussionTopic": "Why writing 350+ words actually LOWERS your score: Increased error probability and zero time left for PSTA proofreading.", "formula": "Ideal Task 2 Length = 4 Paragraphs (Intro + 2 Bodies + Conclusion) | 270 Words in 40 Mins", "teacherNote": "Never write 5 paragraphs unless explicitly instructed. A 4-paragraph structure yields highest cohesion.", "primaryFile": {"name": "Week 3 Study Plan 03.29.05.24.1.pdf", "path": "Week 3/Week 3 Study Plan 03.29.05.24.1.pdf", "type": "PDF", "size": "480 KB", "desc": "خطة دراسة كتابة المقال الأكاديمي Task 2 وجدول التسليم"}}, {"slideNumber": 2, "title": "The BRO Introduction Model", "subtitle": "Drafting a Flawless Academic Introduction in Under 5 Minutes", "category": "Introduction Formula", "content": "<ul><li><strong>Sentence 1 - Background (B):</strong> Set the broad thematic context without using worn clichés like 'Nowadays'.</li><li><strong>Sentence 2 - Rephrase (R):</strong> Paraphrase the prompt completely. Invert sentence order and swap key terms for academic synonyms.</li><li><strong>Sentence 3 - Opinion / Outline (O):</strong> Declare your clear thesis statement. State your stance and foreshadow the two body arguments.</li><li><strong>Model Demonstration:</strong></li><li><em>(B)</em> In the contemporary era, the societal implications of parental educational programs have garnered significant attention.</li><li><em>(R)</em> Whilst some argue that child-rearing is an innate instinct that requires no formal instruction, others contend that mandatory workshops are essential.</li><li><em>(O)</em> In my opinion, structured parental education is quintessential to fostering emotionally resilient and socially adapted children.</li></ul>", "discussionTopic": "Live Writing Sprint: 5 minutes to write a BRO introduction for: 'Some feel governments should provide free university education for all. Discuss both views.'", "formula": "BRO = Background (General) + Rephrase (Synonymous) + Opinion (Definitive Thesis)", "teacherNote": "If you don't express a clear opinion in the introduction for an 'agree/disagree' essay, TR is capped at Band 6.0!", "primaryFile": {"name": "CHIPSET.png", "path": "CHIPSET.png", "type": "PNG", "size": "120 KB", "desc": "المخطط الهيكلي لمنظومة CHIPSET لتوليد أفكار المقال (22 زاوية)"}}, {"slideNumber": 3, "title": "Body Paragraph Architecture: The TEXS Formula", "subtitle": "Guaranteed Cohesion and Depth of Extension", "category": "Body Architecture", "content": "<ul><li><strong>T - Topic Sentence:</strong> Direct statement of the paragraph's single controlling argument. (No linking clichés!).</li><li><strong>E - Explanation:</strong> Elaborate on the underlying logic: 'In other words...', 'This means that...', 'Given that...'.</li><li><strong>X - eXample:</strong> Concrete real-world grounding: 'An eminent example is...', 'Empirical research from Sweden demonstrates that...'.</li><li><strong>S - Significance / Cleft:</strong> Synthesize the profound implication using advanced grammar: 'What can be observed is that...', 'Thus, it is evident that...'.</li><li><strong>Paragraph Length:</strong> 85 - 100 words per body paragraph. Exactly two body paragraphs per essay.</li></ul>", "discussionTopic": "Analyze why an example that says 'For example my cousin Ali' fails academic objectivity and should be framed generally.", "formula": "TEXS = Topic Sentence (Argument) + Explanation (Why) + eXample (Proof) + Significance (Cleft Impact)", "teacherNote": "Notice how each sentence in TEXS has a distinct functional purpose. No empty fluff allowed.", "primaryFile": {"name": "Week 3 Wednesday File.pdf", "path": "Week 3/Week 3 Wednesday File.pdf", "type": "PDF", "size": "1.6 MB", "desc": "هيكلية فقرة الجسم بمعادلة TEXS وتوليد الحجج القوية"}}, {"slideNumber": 4, "title": "The CHIPSET Idea Generation Matrix", "subtitle": "22 Instant Brainstorming Triggers Across 7 Domains", "category": "Brainstorming System", "content": "<ul><li><strong>C (4):</strong> Culture, Children, Crimes, Communication.</li><li><strong>H (3):</strong> Health, History, Humanities.</li><li><strong>I (3):</strong> Interpersonal Skills, Influencers, Industry.</li><li><strong>P (2):</strong> Political, Psychological.</li><li><strong>S (2):</strong> Society (Family, Gender, Class, Generation), Science.</li><li><strong>E (4):</strong> Economic, Education, Eating habits, Environment.</li><li><strong>T (4):</strong> Technology, Time, Traffic, Transport.</li><li><strong>How to Use Under Timed Conditions:</strong> Spend 3 minutes scanning CHIPSET. Pick 1 trigger for Body 1 and 1 trigger for Body 2!</li></ul>", "discussionTopic": "Applying CHIPSET to: 'Should capital punishment be reintroduced?' Triggers: Crimes (C), Psychological (P), Political (P), Society (S).", "formula": "CHIPSET = Your Emergency Idea Vault for Timed Essays", "teacherNote": "Students who memorize CHIPSET never experience writer's block during the real exam.", "primaryFile": {"name": "Week 3 Wednesday File.pdf", "path": "Week 3/Week 3 Wednesday File.pdf", "type": "PDF", "size": "1.6 MB", "desc": "معادلة BRO لصياغة المقدمة والخاتمة المتماسكة"}}, {"slideNumber": 5, "title": "Case Study: IELTS Essay 1 (Parenting Courses)", "subtitle": "Line-by-Line Dissection of a Band 8.5 Model Essay", "category": "Model Deconstruction", "content": "<ul><li><strong>Prompt:</strong> 'Parents should take courses in parenting in order to improve the lives of their children. To what extent do you agree?'</li><li><strong>Key Synonyms Utilized:</strong></li><li>- Parents -> Guardians, Custodians, Caretakers</li><li>- Children -> Offspring, Juveniles, Dependents, Adolescents</li><li>- Essential -> Imperative, Pivotal, Quintessential</li><li>- Discipline -> Coaching, Training, Behavioral workshops</li><li><strong>Inverted Structure in Body 2:</strong> 'Thus, not only is caregiver training pivotal for improving mental health, but also it is crucial for parent-child interaction.'</li><li><strong>Conclusion Formula:</strong> Summary (S) + Final Strong Recommendation (O).</li></ul>", "discussionTopic": "Analyze the exact transition between Body 1 and Body 2 in Essay 1: Why does starting Body 2 with 'Moreover' maintain cohesion?", "formula": "Academic Precision: Swap every repetitive prompt word with 3 high-tier synonyms.", "teacherNote": "Review the full PDF of Essay 1 inside the Writing Laboratory tab.", "primaryFile": {"name": "IELTS Essay 1- Parenting.pdf", "path": "IELTS Essay 1- Parenting.pdf", "type": "PDF", "size": "268 KB", "desc": "المقال النموذجي Band 8.5 لتحليل دورات التربية الإلزامية"}}, {"slideNumber": 6, "title": "The PSTA Proofreading Protocol", "subtitle": "How to Save 0.5 - 1.0 Band in the Final 5 Minutes", "category": "Proofreading", "content": "<ul><li><strong>P - Punctuation:</strong> Check every connector. Did you place a comma after 'In addition,', 'However,', 'On the one hand,'? Are there comma splices?</li><li><strong>S - Spelling:</strong> Scan specifically for your personal chronic spelling traps (e.g. 'environment', 'definitely', 'successful').</li><li><strong>T - Tenses & SVA:</strong> Scan every verb against its subject. Does a singular noun have an '-s' verb? ('The government plays...', 'Society demands...').</li><li><strong>A - Articles:</strong> Scan every noun. Is it a naked singular countable noun? Put 'a' or 'the' in front of it immediately!</li></ul>", "discussionTopic": "Live Audit: Proofreading a candidate's draft in 3 minutes to spot 6 hidden PSTA errors.", "formula": "Finish Writing at Minute 35 -> Allocate Minutes 35-40 Exclusively to PSTA", "teacherNote": "Never use the last 5 minutes to write another paragraph. Proofreading existing text yields higher score gains.", "primaryFile": {"name": "Week 3 Wednesday File.pdf", "path": "Week 3/Week 3 Wednesday File.pdf", "type": "PDF", "size": "1.6 MB", "desc": "بروتوكول المراجعة والتدقيق PSTA للدقائق الخمس الأخيرة"}}, {"slideNumber": 7, "title": "The Saturday IELTS Clinic: Remediation for Band 5/5.5", "subtitle": "Diagnosing & Curing Chronic Structural Weaknesses", "category": "Support Ecosystem", "content": "<ul><li><strong>Clinic Schedule:</strong> Saturday at 1:00 PM - 2:30 PM (Mandatory for students scoring 5.0 or 5.5).</li><li><strong>Root Cause Diagnostics:</strong></li><li>- 1. Word count under 250 words -> Time management drills.</li><li>- 2. Idea listing without elaboration -> TEXS paragraph drills.</li><li>- 3. 'Cancer of IELTS' grammar mistakes -> Grammar prescription.</li><li><strong>'My Mistakes and Proud' Submission:</strong> Students present their weekly mistake log for direct instructor signature and feedback.</li></ul>", "discussionTopic": "Why scoring Band 5.5 on Week 3 is a diagnostic blessing rather than a failure, and how to execute the turnaround.", "formula": "Identify Weakness -> Clinic Surgery -> Re-draft -> Band 7.0 Breakout", "teacherNote": "Remember: The greatest score jumps come from students who attend the Saturday Clinic consistently.", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "عيادة السبت التفاعلية للعلاج السريع للدرجات الأقل من 6.5"}}], "4": [{"slideNumber": 1, "title": "Writing Task 1 Academic: The 6 Visual Chart Types", "subtitle": "Synthesizing Data in 150 Words and Exactly 20 Minutes", "category": "Task 1 Academic", "content": "<ul><li><strong>The 6 Visual Formats:</strong> Bar Charts, Line Graphs, Pie Charts, Tables, Process Diagrams, and Maps/Floorplans.</li><li><strong>Static vs Dynamic Data:</strong> Dynamic data (across time: 2000-2020) requires trend verbs (surged, plummeted). Static data (single year) requires comparative language (exceeded, twice as high).</li><li><strong>The 4-Paragraph Task 1 Formula:</strong></li><li>- Paragraph 1: Paraphrased Introduction (What, Where, When, Units of Measurement).</li><li>- Paragraph 2: The Mandatory Overview (Main trends, highest/lowest extremes, key anomalies).</li><li>- Paragraph 3: Detailed Body 1 (Grouped data with specific numbers).</li><li>- Paragraph 4: Detailed Body 2 (Remaining grouped data with comparisons).</li></ul>", "discussionTopic": "Why copying the exact chart prompt words in Paragraph 1 results in the examiner crossing them out and penalizing your word count.", "formula": "Task 1 Structure = Intro + Overview (Mandatory!) + Body 1 (Data) + Body 2 (Data)", "teacherNote": "Never write a conclusion in Task 1. An Overview in Paragraph 2 is all that is required.", "primaryFile": {"name": "Week 4 Session file Friday.pdf", "path": "Week 4/Week 4 Session file Friday.pdf", "type": "PDF", "size": "820 KB", "desc": "أنواع الرسوم البيانية الستة في Task 1 الأكاديمي"}}, {"slideNumber": 2, "title": "The Golden Rule of Task 1: The Mandatory Overview", "subtitle": "Why Missing It Caps Your Task Achievement at Band 5.0", "category": "Examiner Rules", "content": "<ul><li><strong>Examiner Marking Descriptor:</strong> 'Presents an overview with information appropriately selected' = Band 7. 'Presents no overview' = CAPPED AT BAND 5.0, regardless of vocabulary or grammar!</li><li><strong>How to Write a 2-Sentence Master Overview:</strong></li><li>- Sentence 1 (General Trend / Outcome): 'Overall, it is readily apparent that whilst category A experienced steady upward growth, category B showed a marked decline.'</li><li>- Sentence 2 (Highest & Lowest Outliers): 'Additionally, throughout the period, country X consistently accounted for the highest proportion of energy generation, whereas country Y remained the lowest.'</li><li><strong>The Golden Overview Rule:</strong> NEVER include specific numbers or percentages in the overview! Keep it purely qualitative and comparative.</li></ul>", "discussionTopic": "Identify the critical flaw in this candidate overview: 'Overall, coal was 40% in 1990 and increased to 60% in 2010.' (Contains data, not general trends!).", "formula": "Band 7+ Overview = General Direction + Highest/Lowest Extremes + ZERO Numbers", "teacherNote": "Place your overview immediately after the introduction so the examiner sees it right away.", "primaryFile": {"name": "Week 4 Session file Friday.pdf", "path": "Week 4/Week 4 Session file Friday.pdf", "type": "PDF", "size": "820 KB", "desc": "القاعدة الذهبية لكتابة الـ Overview الإلزامي بدون أرقام"}}, {"slideNumber": 3, "title": "Trend Lexicon & Mixed Chart Strategy", "subtitle": "Handling Dual Charts (Bar + Pie) with Formulaic Precision", "category": "Trend Lexicon", "content": "<ul><li><strong>Upward Trends:</strong> Surged, skyrocketed, soared, climbed, showed an upward trajectory.</li><li><strong>Downward Trends:</strong> Plummeted, plunged, dwindled, plummeted, experienced a sharp contraction.</li><li><strong>Stability & Fluctuations:</strong> Leveled off, plateaued at, fluctuated wildly between X and Y.</li><li><strong>Mixed Charts Formula (Bar + Pie):</strong></li><li>- Intro: 'The provided bar graph shows R1, whilst the pie chart reflects R2. All numbers are expressed in percentages.'</li><li>- Overview: 'Overall, after analyzing the bar graph, it can be seen that the prime reason for travel was work, whilst the pie chart reveals that transport fares represented the primary complaint.'</li></ul>", "discussionTopic": "Drill: Transform 'The sales went down quickly' into 3 distinct Band 8 academic sentences using diverse adverbs and verbs.", "formula": "Mixed Intro = [Chart 1 Rephrased] + whilst/whereas + [Chart 2 Rephrased] + Units", "teacherNote": "Review the mixed chart example from the Week 6 session file.", "primaryFile": {"name": "Week 4 Session file Friday.pdf", "path": "Week 4/Week 4 Session file Friday.pdf", "type": "PDF", "size": "820 KB", "desc": "قاموس الأفعال والظروف الأكاديمية لوصف الاتجاهات والبيانات المركبة"}}, {"slideNumber": 4, "title": "Process Diagrams & Maps: Passive Voice Mastery", "subtitle": "Describing Industrial Cycles and Geographic Evolution", "category": "Process & Maps", "content": "<ul><li><strong>Process Diagrams (e.g. OTEC Energy Cycle):</strong> Pure sequential passive voice! 'In the initial phase, cold water is pumped from the oceanic depths... Subsequently, it is vaporized through a heat exchanger...'</li><li><strong>Sequential Linkers:</strong> Initially -> Subsequently -> Following this -> At the subsequent juncture -> Finally.</li><li><strong>Maps / Floorplans:</strong> Spatial orientation and transformations: 'expanded', 'demolished', 'redeveloped into', 'erected', 'converted to'.</li><li><strong>Compass Prepositions:</strong> 'In the north-eastern quadrant', 'Directly adjacent to the existing terminal', 'To the south of the residential zone'.</li></ul>", "discussionTopic": "Why using active voice in a manufacturing process diagram ('Workers heat the metal') sounds amateurish compared to passive ('The metal is heated').", "formula": "Process Formula = Passive Voice (is/are + V3) + Chronological Discourse Markers", "teacherNote": "Check the OTEC process diagram detailed in the Week 4 session file.", "primaryFile": {"name": "Week 4 Session file Friday.pdf", "path": "Week 4/Week 4 Session file Friday.pdf", "type": "PDF", "size": "820 KB", "desc": "مخططات العمليات وخرائط التطور والتركيز على المبني للمجهول Passive"}}, {"slideNumber": 5, "title": "Task 1 General Training: The 10-Point Letter Matrix", "subtitle": "Calibrating Tone Across Formal, Semi-Formal, and Informal Letters", "category": "General Training", "content": "<ul><li><strong>The 10 Recipient Classification Matrix:</strong></li><li>- 1. City Council -> Formal (F) | Sign-off: 'Yours faithfully'</li><li>- 2. Company Owner -> Formal (F) | Sign-off: 'Yours faithfully'</li><li>- 3. Restaurant Manager -> Formal (F) | Sign-off: 'Yours faithfully'</li><li>- 4. New Manager -> Formal (F) | Sign-off: 'Yours sincerely'</li><li>- 5. Current Manager -> Semi-Formal (SF) | Sign-off: 'Warm regards'</li><li>- 6. Landlord -> Semi-Formal (SF) | Sign-off: 'Kind regards'</li><li>- 7. Neighbor -> Semi-Formal (SF) | Sign-off: 'Best regards'</li><li>- 8. Colleague -> Semi-Formal (SF) | Sign-off: 'Best regards'</li><li>- 9. Instructor / Supervisor -> Semi-Formal (SF) | Sign-off: 'Sincerely'</li><li>- 10. Relative or Friend -> Informal (INF) | Casual emotional tone, contractions allowed ('I'm'), exclamation marks, sign-off: 'Warmly'</li></ul>", "discussionTopic": "Why using abbreviations ('can't', 'won't') or an exclamation mark in a letter to a City Council immediately caps your Tone score at Band 5.0.", "formula": "Register Target: Formal = No Contractions, Passive Tone | Informal = Conversational & Emotional", "teacherNote": "Review the full letter classification table from the Week 4 Wednesday session file.", "primaryFile": {"name": "Wednesdays file .pdf", "path": "Week 4/Wednesdays file .pdf", "type": "PDF", "size": "950 KB", "desc": "مصفوفة كتابة الخطابات الرسمية وغير الرسمية للتدريب العام"}}, {"slideNumber": 6, "title": "Comparative Analysis: France vs Germany Electricity Report", "subtitle": "Extracting Key Groupings from Complex Data Sets", "category": "Model Task 1", "content": "<ul><li><strong>Prompt:</strong> 'Compare electricity generation by fuel source in France and Germany in 2009.'</li><li><strong>Data Grouping Strategy:</strong> Group by primary energy source rather than listing country-by-country!</li><li>- Body 1: Nuclear and Renewables (France dominating nuclear at over 75%, Germany relying on renewables).</li><li>- Body 2: Fossil Fuels (Germany relying heavily on coal and natural gas, France minimal).</li><li><strong>Band 8 Comparative Structures:</strong> 'In stark contrast to Germany, France generated the overwhelming majority of its power from nuclear sources, standing at roughly three-quarters of total output.'</li></ul>", "discussionTopic": "Why grouping by feature (energy source) is Band 8, whereas describing all of France then all of Germany is Band 6.", "formula": "Task 1 Grouping: Group by Major Patterns, not isolated data points.", "teacherNote": "Study the exact electricity model report in the course assets.", "primaryFile": {"name": "Week 4 Session file Friday.pdf", "path": "Week 4/Week 4 Session file Friday.pdf", "type": "PDF", "size": "820 KB", "desc": "تقرير مقارنة توليد الكهرباء في فرنسا وألمانيا (نموذج Band 8)"}}, {"slideNumber": 7, "title": "Week 4 Live Workshop & Timed Drafting", "subtitle": "Wednesday Live Workshop: 20-Minute Task 1 Pressure Test", "category": "Live Workshop", "content": "<ul><li><strong>Live 20-Minute Chart Sprint:</strong> Candidates receive an unannounced bar-line chart and must draft Paragraph 1 & 2 in 8 minutes.</li><li><strong>Peer Overview Audit:</strong> Swapping overviews with peers to verify that ZERO numbers were included.</li><li><strong>General Training Letter Clinic:</strong> Drafting a semi-formal complaint letter to a landlord regarding water leakage.</li><li><strong>Assignment:</strong> Submit 2 essays this week: 1 Task 1 Report + 1 Task 2 Essay before Sunday.</li></ul>", "discussionTopic": "Time management: How to partition 20 minutes: 3 mins planning + 14 mins drafting + 3 mins PSTA checking.", "formula": "3 mins Plan + 14 mins Write + 3 mins PSTA = Flawless 150 Words", "teacherNote": "Never let Task 1 steal time from Task 2 during practice or the real exam.", "primaryFile": {"name": "Week 4 Session file Friday.pdf", "path": "Week 4/Week 4 Session file Friday.pdf", "type": "PDF", "size": "820 KB", "desc": "إدارة الـ 20 دقيقة بدقة وتوزيع أجزاء التقرير"}}], "5": [{"slideNumber": 1, "title": "IELTS Listening Master Blueprint: The 4 Sections", "subtitle": "Navigating Increasing Cognitive Load from Section 1 to Section 4", "category": "Listening Dynamics", "content": "<ul><li><strong>Section 1: Social Dialogue:</strong> Two speakers in everyday social context (booking hotel, renting flat). Focus on names, telephone numbers, dates, addresses.</li><li><strong>Section 2: Social Monologue:</strong> One speaker providing social information (guided tour of museum, charity event). Map labeling and multiple-choice questions.</li><li><strong>Section 3: Academic Discussion:</strong> 2 to 4 students and a tutor discussing an assignment or research project. High speed, overlapping opinions, and subtle agreements/disagreements.</li><li><strong>Section 4: Academic Lecture:</strong> One professor lecturing on an academic topic (marine biology, archaeology). 10 consecutive completion questions with NO pause in the middle!</li></ul>", "discussionTopic": "Why Section 4 has zero pauses in the middle and requires maintaining unbroken acoustic focus for 6.5 minutes.", "formula": "Listening Stamina: Section 1 (Easy 10/10) -> Section 2 & 3 (Battleground) -> Section 4 (Band 8/9 Decider)", "teacherNote": "You cannot afford more than 1 mistake across Section 1 and Section 2 if targeting Band 8.0.", "primaryFile": {"name": "week 5 sessions file  .pdf", "path": "Week 5/week 5 sessions file  .pdf", "type": "PDF", "size": "1.7 MB", "desc": "الهيكل التشريحي لأقسام الاستماع الأربعة واستراتيجيات التركيز"}}, {"slideNumber": 2, "title": "The 30-Second Preview Technique & Grammar Prediction", "subtitle": "Winning the Battle Before the Audio Even Starts", "category": "Listening Techniques", "content": "<ul><li><strong>The 30-Second Rule:</strong> Never read instructions during the preview! Immediately jump to the questions and circle keywords.</li><li><strong>Predicting the Grammatical Category:</strong> Determine the exact part of speech required in each blank:</li><li>- 'The project requires a [NOUN - equipment / person / budget]'</li><li>- 'The climate was described as [ADJECTIVE - arid / humid / temperate]'</li><li>- 'The species became extinct in [NUMBER / YEAR]'</li><li><strong>Predicting Singular vs Plural:</strong> If preceded by 'a/an', it must be singular. If preceded by 'various' or 'many', it must end in '-s'.</li></ul>", "discussionTopic": "Speed Drill: Predict the grammar and category of 5 fill-in-the-blank questions in under 15 seconds.", "formula": "Keyword Circling + Grammatical Category Prediction = 80% Success Rate", "teacherNote": "Train yourself to read ahead during the gap between Section 1 and Section 2.", "primaryFile": {"name": "week 5 sessions file  .pdf", "path": "Week 5/week 5 sessions file  .pdf", "type": "PDF", "size": "1.7 MB", "desc": "تكنيك استثمار الـ 30 ثانية وتوقع نوع الكلمة وقواعد الإملاء"}}, {"slideNumber": 3, "title": "Trap Decryption: Distractors & Self-Correction Tricks", "subtitle": "How Cambridge Exam Writers Intentionally Mislead You", "category": "Listening Traps", "content": "<ul><li><strong>The Self-Correction Distractor:</strong> The speaker states an answer, then abruptly retracts it: 'Let's schedule the delivery for Tuesday... Oh wait, our warehouse is closed then, let's make it Thursday instead.' (Answer: Thursday!).</li><li><strong>The Synonymous Paraphrase Trap:</strong> The question paper says 'inexpensive', but the audio says 'won't cost an arm and a leg' or 'reasonably priced'.</li><li><strong>The Multi-Option Mention:</strong> In multiple-choice questions, the speaker will mention ALL options A, B, and C. Only one matches the specific qualifying condition of the stem.</li><li><strong>The Condition Qualifier:</strong> 'Provided that...', 'Unless...', 'Except for...'.</li></ul>", "discussionTopic": "Analyze audio clip from Cambridge 16 Test 2 Section 3: Identifying the exact pivot phrase that eliminates Distractor B.", "formula": "Listen for Pivot Words: 'Actually...', 'However...', 'In fact...', 'Instead of...'", "teacherNote": "Never write down the first number or date you hear without waiting 3 seconds for potential self-correction.", "primaryFile": {"name": "week 5 sessions file  .pdf", "path": "Week 5/week 5 sessions file  .pdf", "type": "PDF", "size": "1.7 MB", "desc": "تفكيك المشتتات والكلمات المحورية الفاصلة (Actually, However, Instead)"}}, {"slideNumber": 4, "title": "The 1.25x Speed Conditioning Protocol", "subtitle": "Training Your Auditory Reflexes for Effortless Real-Exam Comprehension", "category": "Speed Training", "content": "<ul><li><strong>The High-Altitude Training Theory:</strong> When you train listening at 1.25x speed, the real exam audio (1.0x) sounds slow, calm, and predictable.</li><li><strong>How to Execute:</strong></li><li>- Take Cambridge practice tests 15-18 on YouTube or VLC player set to 1.25x speed.</li><li>- Target score at 1.25x: At least 32/40 (Band 7.5).</li><li>- When sitting for the actual exam, your processing speed will easily capture subtle distractor words.</li><li><strong>Handling Fast British & Australian Accents:</strong> Accustom your ear to non-rhotic pronunciation and connected speech glottal stops.</li></ul>", "discussionTopic": "Debate: Does practicing at 1.25x cause panic initially? Yes, but after 3 tests, the brain adapts permanently.", "formula": "1.25x Speed Practice -> Auditory Overdrive -> 1.0x Exam Sounds Relaxed & Clear", "teacherNote": "Do not practice at 1.5x speed; that distorts natural intonation. 1.25x is the sweet spot.", "primaryFile": {"name": "week 5 sessions file  .pdf", "path": "Week 5/week 5 sessions file  .pdf", "type": "PDF", "size": "1.7 MB", "desc": "بروتوكول التدريب الصوتي على سرعة 1.25x لرفع اليقظة السمعية"}}, {"slideNumber": 5, "title": "Fatal Listening Traps: Word Count & Plural 'S'", "subtitle": "The Trivial Slips That Cost Hundreds of Candidates Their Band 8", "category": "Exam Rules", "content": "<ul><li><strong>Strict Word Limit Trap:</strong> 'NO MORE THAN ONE WORD AND/OR A NUMBER': If you write 'on the 24th of May', you receive 0 marks! (Correct: '24 May' = one word and a number).</li><li><strong>Year Only Trap:</strong> If the question asks 'Year of establishment: ______' and you write 'In 1995', you lose the mark! Write simply '1995'.</li><li><strong>The Missing Plural 'S':</strong> If the recording says 'reservations' and you write 'reservation', computer grading marks it WRONG immediately. Always check the final consonant!</li><li><strong>Capitalization Rule:</strong> IELTS does NOT penalize capitalization in listening. You can write everything in ALL CAPITAL LETTERS to avoid proper noun capitalization mistakes!</li></ul>", "discussionTopic": "Class consensus: Writing listening answers in ALL CAPS (e.g. 'LONDON', 'STATION ROAD') - why it prevents letter case penalties.", "formula": "Write in ALL CAPS in Listening & Reading = Zero Capitalization Worries", "teacherNote": "Always double check plural '-s' endings during the final checking window.", "primaryFile": {"name": "week 5 sessions file  .pdf", "path": "Week 5/week 5 sessions file  .pdf", "type": "PDF", "size": "1.7 MB", "desc": "قاعدة الكتابة بالأحرف الكبيرة ALL CAPS ومصيدة الجمع والمفرد"}}, {"slideNumber": 6, "title": "Week 5 Live Workshop: Mid-Course Audit & Section 3 Surgery", "subtitle": "Wednesday Live Workshop: Section 3 Multi-Speaker Combat", "category": "Live Workshop", "content": "<ul><li><strong>Live Section 3 Simulation:</strong> Playing a complex 4-speaker academic discussion at 1.25x speed in real time.</li><li><strong>Instant Error Autopsy:</strong> Revealing which questions suffered from distractor traps and tracking student misses.</li><li><strong>Eid Policy & Schedule Clarification:</strong> While the administrative team is on leave, the instructor is available 24/7 in private for urgent consultations.</li><li><strong>Capsule Video Dispatch:</strong> Distributing the mid-course summary video covering Weeks 1 to 5 mastery.</li></ul>", "discussionTopic": "Audit of the mid-course progress: Celebrating candidates who broke the Band 7.0 ceiling on this week's essay.", "formula": "Mid-Course Milestone: If your essay is at 6.5+, you are on track for Band 7.5 on exam day.", "teacherNote": "Submit your Week 5 essays on Sunday after Eid.", "primaryFile": {"name": "Week 5 Study plan.pdf", "path": "Week 5/Week 5 Study plan.pdf", "type": "PDF", "size": "495 KB", "desc": "التدقيق النصفي وتقييم تقدم المرشح نحو Band 8.0"}}], "6": [{"slideNumber": 1, "title": "The 15-20-25 Minute Reading Strategy", "subtitle": "Cognitive Stamina & Time Allocation Across 3 Passages", "category": "Reading Strategy", "content": "<ul><li><strong>The 60-Minute Trap:</strong> Candidates spend 20 minutes equally on each passage, only to run out of time on Passage 3 (the most complex philosophical text!).</li><li><strong>The 15-20-25 Pacing Architecture:</strong></li><li>- <strong>Passage 1 (15 Mins):</strong> Descriptive, factual text. Target: 12-13/13 correct. Quick scanning and keyword matching.</li><li>- <strong>Passage 2 (20 Mins):</strong> Explanatory/analytical text. Target: 10-11/13 correct. Multiple matching and heading questions.</li><li>- <strong>Passage 3 (25 Mins):</strong> Abstract discursive debate. Target: 9-11/14 correct. Demands deep contextual comprehension and author tone inference.</li><li><strong>Zero Transfer Time Rule:</strong> Unlike listening, you get NO extra transfer time! Write answers directly onto the sheet as you proceed.</li></ul>", "discussionTopic": "Why spending 22 minutes on Passage 1 creates psychological panic that destroys Passage 3 performance.", "formula": "15 mins (Passage 1) + 20 mins (Passage 2) + 25 mins (Passage 3) = 60 Mins Flawless Pacing", "teacherNote": "Wear an analog wristwatch during practice and mark the 15-minute intervals strictly.", "primaryFile": {"name": "Week 6 File Friday updated on Saturday .pdf", "path": "Week 6/Week 6 File Friday updated on Saturday .pdf", "type": "PDF", "size": "1.9 MB", "desc": "استراتيجية إدارة الوقت 15-20-25 دقيقة لنصوص القراءة الثلاثة"}}, {"slideNumber": 2, "title": "True / False / Not Given Ironclad Logic", "subtitle": "Eliminating Subjective Assumptions from Your Reading Score", "category": "TFNG Mastery", "content": "<ul><li><strong>TRUE:</strong> The statement matches the passage meaning 100%. (Synonymous paraphrase of facts).</li><li><strong>FALSE:</strong> The statement directly CONTRADICTS what is stated in the passage. (Opposite meaning or mutually exclusive fact).</li><li><strong>NOT GIVEN:</strong> The passage does NOT contain sufficient information to confirm or deny the statement.</li><li><strong>The Golden Iron Rule:</strong> NEVER use your personal outside real-world knowledge! If the text does not explicitly state it, it is NOT GIVEN, even if it is a well-known scientific fact in real life!</li><li><strong>Extreme Modifiers Warning:</strong> Words like 'always', 'all', 'never', 'only', 'impossible' in the question often indicate FALSE or NOT GIVEN when the text uses 'sometimes' or 'some'.</li></ul>", "discussionTopic": "Class Exercise: 3 controversial statements from Cambridge 17. Distinguishing between FALSE (proven contradiction) and NOT GIVEN (unmentioned).", "formula": "TRUE = 100% Match | FALSE = Direct Contradiction | NOT GIVEN = Absence of Proof", "teacherNote": "Remember: Not Given does NOT mean false. It simply means the author didn't say either way.", "primaryFile": {"name": "Week 6 File Friday updated on Saturday .pdf", "path": "Week 6/Week 6 File Friday updated on Saturday .pdf", "type": "PDF", "size": "1.9 MB", "desc": "منطق TFNG الدقيق: الفرق الحاسم بين التناقض الصريح والغياب التام"}}, {"slideNumber": 3, "title": "Matching Headings & Rapid Skimming Protocol", "subtitle": "Identifying Topic Sentences vs Supporting Distractors", "category": "Headings Strategy", "content": "<ul><li><strong>The Heading Strategy:</strong> ALWAYS do Matching Headings FIRST before any other question type for that passage! It gives you a cognitive map of the entire text.</li><li><strong>First & Last Sentence Rule:</strong> In 80% of academic paragraphs, the main idea resides in the first 2 sentences or the concluding sentence.</li><li><strong>Beware of Keyword Traps:</strong> Exam writers place the exact word from Heading IV inside Paragraph C, but the paragraph is actually about Heading VII! Match the CORE MEANING of the paragraph, not isolated words.</li><li><strong>Cross Out Used Headings:</strong> Physically eliminate headings once assigned to narrow your options.</li></ul>", "discussionTopic": "Analyze Paragraph B from the William Kamkwamba passage: Identifying why Heading 3 is a trap despite sharing vocabulary.", "formula": "Read Paragraph First -> Formulate 3-Word Mental Summary -> Scan Headings -> Match Core Meaning", "teacherNote": "If stuck between two headings, mark both and move on. Context in subsequent paragraphs usually resolves it.", "primaryFile": {"name": "Week 6 File Friday updated on Saturday .pdf", "path": "Week 6/Week 6 File Friday updated on Saturday .pdf", "type": "PDF", "size": "1.9 MB", "desc": "استراتيجية مطابقة العناوين Matching Headings وتلخيص الفكرة المحورية"}}, {"slideNumber": 4, "title": "Case Study: William Kamkwamba Windmill Passage", "subtitle": "Question-by-Question Autopsy of a Real Academic Reading Test", "category": "Passage Autopsy", "content": "<ul><li><strong>Passage Context:</strong> A Malawian teenager who built a windmill from scrap to bring electricity and water to his village.</li><li><strong>Question 7 Analysis:</strong> 'The windmill brought William instant local fame, BUT despite his accomplishment...' (Contrast transition keyword).</li><li><strong>Question 8 Analysis:</strong> Tracing the chronological publication in the Malawi Daily newspaper and the arrival of international journalists.</li><li><strong>Vocabulary Extracted from Text:</strong></li><li>- Drought, Famine, Scrap yard, Dynamo, Irrigation, Lifestyle revolution.</li><li>- Notice how the questions follow chronological order through the text!</li></ul>", "discussionTopic": "Demonstrating how questions 1 through 6 map chronologically from paragraph 1 to 5, while questions 7 to 13 map to the second half.", "formula": "Chronological Question Ordering = Your Greatest Navigation Asset in IELTS Reading", "teacherNote": "Study the full text annotations from the Week 6 session file.", "primaryFile": {"name": "Week 6 File Friday updated on Saturday .pdf", "path": "Week 6/Week 6 File Friday updated on Saturday .pdf", "type": "PDF", "size": "1.9 MB", "desc": "دراسة حالة نص ويليام كامكوامبا وتتبع الترتيب الزمني للأسئلة"}}, {"slideNumber": 5, "title": "The Academic Word List (AWL) & Contextual Deduction", "subtitle": "High-Yield Lexical Roots That Unlock 90% of Complex Academic Texts", "category": "Lexical Power", "content": "<ul><li><strong>The 570 Academic Word Families:</strong> Master words like 'constitute', 'derive', 'evident', 'fluctuate', 'indicate', 'legislation', 'preliminary'.</li><li><strong>Contextual Deduction:</strong> When you encounter an unknown word (e.g. 'heliocentric'), analyze:</li><li>- 1. Morphological roots (helio = sun, centric = center).</li><li>- 2. Contextual contrast markers ('unlike previous geocentric theories, heliocentric models...').</li><li>- 3. Appositive explanations separated by commas or dashes.</li><li><strong>Never Stop at Unknown Words:</strong> Keep moving! Most unknown words are not even tested in the questions.</li></ul>", "discussionTopic": "Live Exercise: Inferring the meaning of 4 obscure academic terms in a biological science passage without a dictionary.", "formula": "AWL Mastery + Contextual Inference = 100% Reading Comprehension", "teacherNote": "Spend 15 minutes every morning reviewing 20 AWL word families.", "primaryFile": {"name": "Week 6 File Friday updated on Saturday .pdf", "path": "Week 6/Week 6 File Friday updated on Saturday .pdf", "type": "PDF", "size": "1.9 MB", "desc": "قائمة الكلمات الأكاديمية AWL واستنتاج المعنى من السياق"}}, {"slideNumber": 6, "title": "Test Booking Readiness & The Grand Simulation Protocol", "subtitle": "The 4 Ironclad Criteria Before Booking Your Real Exam", "category": "Readiness Protocol", "content": "<ul><li><strong>Are You Ready to Book the Real Exam? (10 - 20 August Window):</strong></li><li><strong>1. Speaking:</strong> Zero pauses, zero fatal grammar mistakes, fluent use of 2-3 idioms.</li><li><strong>2. Writing:</strong> Finish both Task 1 (150 words) and Task 2 (250 words) in 50 minutes, leaving 10 minutes for PSTA proofreading!</li><li><strong>3. Listening:</strong> Scoring 32+/40 consistently at 1.25x speed.</li><li><strong>4. Reading:</strong> Completing all 3 passages accurately within the strict 60-minute limit.</li><li><strong>Simulation on Friday:</strong> Full 3-hour continuous simulation under real exam conditions.</li></ul>", "discussionTopic": "Self-Evaluation: Auditing each student against the 4 criteria to determine their ideal August booking date.", "formula": "If All 4 Criteria Met -> Book Real Exam with IDP / British Council Immediately!", "teacherNote": "Do not book the exam if your writing takes 65 minutes. Build speed first.", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "معايير جاهزية حجز الاختبار الرسمي في أغسطس وبروتوكول المحاكاة"}}, {"slideNumber": 7, "title": "Week 6 Live Workshop: Timed Passage 2 Simulation", "subtitle": "Friday Live Workshop: The 20-Minute Challenge", "category": "Live Workshop", "content": "<ul><li><strong>Live Timed Reading Sprint:</strong> 20 minutes on an unseen Passage 2 with True/False/Not Given and Headings.</li><li><strong>Instant Scoring & Error Mapping:</strong> Identifying if mistakes were caused by speed, vocabulary, or subjective assumptions.</li><li><strong>Simulation Logistics Briefing:</strong> Rules for Friday's 3-hour mock exam: No breaks, no mobile phones, webcam active.</li><li><strong>Course Honors Announcement:</strong> Criteria for Course Attendance Certificate and Instructor Recommendation Letter.</li></ul>", "discussionTopic": "Debrief: Did you finish the passage within 20 minutes? What was the primary distractor that trapped students on Q5?", "formula": "Timed Sprint + Immediate Diagnosis = Speed Optimization", "teacherNote": "Get plenty of rest before Friday's 3-hour simulation mock.", "primaryFile": {"name": "Week 6 File Friday updated on Saturday .pdf", "path": "Week 6/Week 6 File Friday updated on Saturday .pdf", "type": "PDF", "size": "1.9 MB", "desc": "مناقشة نتائج تدريب القراءة وسرعة إنهاء الأسئلة"}}], "7": [{"slideNumber": 1, "title": "The Grand 3-Hour Simulation Exam Protocol", "subtitle": "Mirroring Exact British Council and IDP Test Day Realities", "category": "Simulation Day", "content": "<ul><li><strong>Full Unbroken Sequence:</strong> Listening (30 mins + 2/10 mins) -> Reading (60 mins) -> Writing (60 mins). Total: 2 Hours 45 Minutes with ZERO toilet or rest breaks!</li><li><strong>Speaking Exam:</strong> Scheduled separately on the same weekend via private video appointment.</li><li><strong>Simulating Stress & Cognitive Fatigue:</strong> By the time you reach Writing Task 2, your brain has been working intensely for 2 hours. Your habits (BRO, TEXS, PSTA) must be automatic!</li><li><strong>Grading & Diagnostic Report:</strong> Every candidate receives a complete diagnostic band breakdown with line-by-line feedback on both essays.</li></ul>", "discussionTopic": "Managing cognitive stamina: How eating slow-release complex carbs and staying hydrated prevents the 2-hour mental slump.", "formula": "Realistic Simulation = Zero Surprises on Official Test Day", "teacherNote": "Treat this mock exactly like the official test. Adhere strictly to the time limit.", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "بروتوكول المحاكاة الشاملة 3 ساعات متواصلة بدون توقف"}}, {"slideNumber": 2, "title": "Exam Day Psychological Tactics & Room Strategy", "subtitle": "Optimizing Performance in the Official Test Center", "category": "Exam Day Mastery", "content": "<ul><li><strong>Sleep & Nutrition Protocol:</strong> 8 hours of sleep the night before. High-protein, low-sugar breakfast. Moderate caffeine only (avoid jitters).</li><li><strong>Arrival Logistics:</strong> Arrive at the test center 45 minutes prior. Passport and identification verification. Fingerprint and digital photography.</li><li><strong>In the Exam Hall:</strong> Adjust headphone volume immediately during the sound check. Raise your hand if there is any acoustic hum.</li><li><strong>Speaking Exam Psychology:</strong> Treat the examiner as an interested colleague, not a judge. Smile, project confidence, and speak slightly louder than normal to show energy.</li></ul>", "discussionTopic": "Combating sudden test-day blank outs: The 5-second box breathing technique to reset your autonomic nervous system.", "formula": "Composure + Preparation + Tactical Execution = Band 8.5", "teacherNote": "Remember: The examiner wants you to do well. Their job is to give you marks, not trick you.", "primaryFile": {"name": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "path": "Course Schedule and Outline (SUMMER 2024) IMPORTANT DATES.pdf", "type": "PDF", "size": "328 KB", "desc": "التكتيكات النفسية وإدارة القلق وطقوس يوم الامتحان الرسمي"}}, {"slideNumber": 3, "title": "Course Completion Honors & Next Steps", "subtitle": "Your Graduation Toolkit and Ongoing Support", "category": "Course Honors", "content": "<ul><li><strong>1. Official Certificate of Completion:</strong> Endorsed by Dr. Muhammad Khalil Moussa and Engli-Vision.</li><li><strong>2. Academic Recommendation Letter:</strong> Customized formal letter highlighting your verified English proficiency for universities and employers.</li><li><strong>3. Two Free Pre-Exam Essay Corrections:</strong> Submit 2 fresh essays right before sitting for your official test for final calibration!</li><li><strong>4. The Crash Practice Course (19 July - 2 August):</strong> 2 weeks of intensive daily practice with 5 additional speaking exams and 5 writing exams.</li></ul>", "discussionTopic": "Final Consultations: Scheduling your post-course 1-on-1 strategy call to finalize your test booking date.", "formula": "Course Completion -> Crash Practice -> Official Test -> Band 8.0 Achievement", "teacherNote": "
