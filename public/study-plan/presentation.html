eading in strict 60 minutes.", "deadline": "Thursday, 4 July 2024 (08:00 PM)"}, {"id": "ls-w6-fri", "week": 6, "day": "Friday", "date": "5 July 2024", "time": "02:00 PM - 05:00 PM", "title": "The Grand 3-Hour Simulation Exam & William Kamkwamba Autopsy", "skill": "Grand Mock Simulation", "discussionAgenda": ["Full 3-Hour Continuous Simulation Mock Exam: Listening, Reading, and Writing under strict conditions.", "William Kamkwamba windmill passage analysis: Question-by-question mapping.", "Exam Readiness Audit: Criteria for booking the official exam (10 - 20 August window).", "Awarding Attendance Certificates, Recommendation Letters, and Crash Course access."], "strategySpotlight": "3-Hour Exam Simulation & Booking Criteria", "coreVideos": ["Final Simulation Walkthrough", "William Kamkwamba Passage Breakdown"], "foreignMasterVideo": "fm-8", "assignment": "Review full diagnostic score report and book official exam date.", "deadline": "Wednesday, 10 July 2024"}], "chipsetSystem": {"name": "CHIPSET Idea Generation System", "purpose": "A cognitive brainstorming framework for Writing Task 2 and Speaking Part 3, guaranteeing instant academic points under timed pressure.", "categories": [{"letter": "C", "count": 4, "name": "Culture, Children, Crimes, Communication", "keywords": "cultural heritage, parenting discipline, delinquency, digital discourse", "exampleTopic": "Impact of media on violent youth behavior"}, {"letter": "H", "count": 3, "name": "Health, History, Humanities", "keywords": "preventative medicine, historical precedents, liberal arts education", "exampleTopic": "Funding hospitals vs space exploration"}, {"letter": "I", "count": 3, "name": "Interpersonal Skills, Influencers, Industry", "keywords": "soft skills, social media figures, manufacturing automation", "exampleTopic": "Online celebrities influencing youth consumer habits"}, {"letter": "P", "count": 2, "name": "Political, Psychological", "keywords": "governmental policy, mental health, cognitive development", "exampleTopic": "Mandatory voting or psychiatric support in schools"}, {"letter": "S", "count": 2, "name": "Society (Family, Gender, Class, Generation), Science", "keywords": "gender pay gap, generation divide, empirical research", "exampleTopic": "Nuclear family changes in urban societies"}, {"letter": "E", "count": 4, "name": "Economic, Education, Eating habits, Environment", "keywords": "fiscal deficit, curriculum reform, obesity epidemic, carbon emissions", "exampleTopic": "Taxing sugary drinks or subsidizing green transport"}, {"letter": "T", "count": 4, "name": "Technology, Time, Traffic, Transport", "keywords": "artificial intelligence, work-life balance, urban congestion, bullet trains", "exampleTopic": "Remote work vs commuting in mega-cities"}]}, "texsSystem": {"name": "TEXS Body Paragraph Architecture", "purpose": "The formula used by top candidates to score Band 8.0+ in Task Response and Coherence & Cohesion for Writing Task 2.", "steps": [{"step": "T", "title": "Topic Sentence", "desc": "States the central argument directly without fluff. One clear controlling idea.", "example": "In the beginning, many youths leave their home countries and migrate abroad primarily for economic reasons."}, {"step": "E", "title": "Explanation / Elaboration", "desc": "Expands on why and how the topic sentence operates ('In other words...', 'This means that...').", "example": "In other words, upon graduation, young specialists prefer international relocation to multiply their disposable income and secure permanent career stability."}, {"step": "X", "title": "eXample", "desc": "Grounds the argument with a concrete, realistic, or statistical reference ('An eminent example is...').", "example": "An eminent example is Egypt, where thousands of medical and engineering graduates relocate to Gulf states due to domestic economic recession and low starting salaries."}, {"step": "S", "title": "Significance / Cleft Sentence", "desc": "Synthesizes the broader impact using advanced grammar (Cleft sentences: 'What can be said is that...', 'It is... that...').", "example": "What can be said is that this brain drain poses an existential threat to developing economies as qualified cadres seek financial security abroad."}]}, "broSystem": {"name": "BRO Introduction Architecture", "purpose": "A 3-sentence introduction structure that takes under 5 minutes to draft and guarantees Band 8+ Task Response.", "steps": [{"step": "B", "title": "Background", "desc": "A broad descriptive opening stating the contemporary context without clichés.", "example": "In the contemporary era, the escalating mobility of international labor has sparked intense debate worldwide."}, {"step": "R", "title": "Rephrase", "desc": "Paraphrase the prompt using syntactic inversion and academic synonyms.", "example": "Whilst some commentators opine that this exodus depletes national human capital, others argue that it enriches both individuals and remittances."}, {"step": "O", "title": "Opinion / Outline", "desc": "A definitive thesis statement outlining your exact position and essay roadmap.", "example": "In my opinion, although brain drain presents short-term domestic hurdles, the long-term knowledge transfer and economic benefits are overwhelmingly positive."}]}, "whtfmSystem": {"name": "WHTFM Speaking Monologue Formula", "purpose": "Prevents hesitation, silence, and filler sounds ('aaaaa') during the 2-minute Speaking Part 2 cue card monologue.", "steps": [{"step": "W", "title": "What", "desc": "Identify what the person, place, object, or event is with specific vivid adjectives.", "example": "I would like to talk about an English literature workshop I attended last year..."}, {"step": "H", "title": "How", "desc": "Explain how it happened, how it was structured, or how you got involved.", "example": "It was conducted interactively via Zoom by a Cambridge-certified tutor who engaged us in analytical debates..."}, {"step": "T", "title": "Time", "desc": "Specify the temporal context, duration, and frequency using past tense mastery.", "example": "This occurred back in the autumn of 2023, lasting over six rigorous weekends..."}, {"step": "F", "title": "Feelings", "desc": "Articulate internal emotional responses using idiomatic and nuanced vocabulary.", "example": "Initially, I felt completely out of my depth, but soon I was over the moon with my measurable progress..."}, {"step": "M", "title": "Meaning / Significance", "desc": "Reflect on the long-term impact, lessons learned, or life takeaway.", "example": "Looking back, that experience was a turning point that revolutionized my academic presentation skills."}]}, "pstaSystem": {"name": "PSTA Proofreading Protocol", "purpose": "A disciplined 5-minute pre-submission audit protocol to prevent Band 5 penalties on silly slips.", "steps": [{"letter": "P", "focus": "Punctuation", "checklist": "Check for commas immediately after connectors ('In addition,', 'However,'). Ensure no comma splices between independent clauses."}, {"letter": "S", "focus": "Spelling", "checklist": "Verify high-frequency academic traps: 'environment', 'government', 'definitely', 'successful', 'occurred', 'accommodate'."}, {"letter": "T", "focus": "Tenses & SVA", "checklist": "Subject-Verb Agreement check: 'Every student needs' (not need). No accidental tense shifting from present to past."}, {"letter": "A", "focus": "Articles", "checklist": "Check every singular countable noun for 'a', 'an', or 'the'. Check that plural and uncountable nouns do not have unnecessary 'a'."}]}, "fatalGrammarMistakes": [{"id": 1, "name": "Subject-Verb Agreement (SVA) Failure", "bad": "The number of students in universities are increasing rapidly.", "good": "The number of students in universities IS increasing rapidly. / A number of students ARE...", "penalty": "Immediately drags Grammatical Range & Accuracy down to Band 5.0 if repeated 3+ times.", "rule": "'The number of' takes a singular verb; 'A number of' takes a plural verb."}, {"id": 2, "name": "Comma Splice & Run-on Sentences", "bad": "The government should invest in green energy, it will reduce pollution.", "good": "The government should invest in green energy; it will reduce pollution. OR ...green energy, WHICH will reduce...", "penalty": "Severely damages both GRA and Coherence & Cohesion.", "rule": "Never join two complete independent clauses with a comma alone. Use a semicolon, period, or coordinating conjunction."}, {"id": 3, "name": "Sentence Fragments", "bad": "Although many people believe that electric vehicles solve urban pollution.", "good": "Although many people believe that electric vehicles solve urban pollution, their production also consumes massive resources.", "penalty": "Shows incomplete syntactic command, capping GRA at Band 5.5.", "rule": "A dependent clause starting with 'Although/Because/While' must be connected to a main independent clause."}, {"id": 4, "name": "Tense Inconsistency (Shifting Tenses)", "bad": "In 2010, the economy suffered a crash and leads to widespread unemployment.", "good": "In 2010, the economy suffered a crash and LED to widespread unemployment.", "penalty": "Examiners penalize lack of temporal control in Task 1 historical data descriptions.", "rule": "Maintain the past tense when referring to completed historical timeframes (e.g. 2005 - 2020)."}, {"id": 5, "name": "Article Omission with Singular Countable Nouns", "bad": "Government must build new hospital in this city.", "good": "THE government must build A new hospital in this city.", "penalty": "The most common non-native speaker error; signals non-native fossilization.", "rule": "Every singular countable noun MUST have a determiner (a/an, the, this, my)."}, {"id": 6, "name": "Pluralizing Uncountable Nouns", "bad": "The teacher gave us many useful advices, informations, and knowledges.", "good": "The teacher gave us a wealth of useful ADVICE, INFORMATION, and KNOWLEDGE.", "penalty": "Marks candidate down in both Lexical Resource and GRA.", "rule": "Advice, research, information, equipment, luggage, feedback, and knowledge NEVER take an 's'."}, {"id": 7, "name": "Preposition Collocation Mismatches", "bad": "Discuss about the issue / Married with an engineer / Responsible of the project.", "good": "Discuss the issue / Married TO an engineer / Responsible FOR the project.", "penalty": "Unnatural collocations cap Lexical Resource at Band 6.0.", "rule": "'Discuss' takes no preposition; 'Married to'; 'Responsible for'; 'Prevent from'."}], "writingLab": {"essay1Parenting": {"title": "IELTS Essay 1: Parenting Courses (Band 8.5 Model)", "prompt": "Parents should take courses in parenting in order to improve the lives of their children. To what extent do you agree?", "stance": "Strongly Agree with nuanced academic qualifications", "wordCount": 278, "paragraphs": [{"type": "Introduction (BRO)", "content": "(R) In the modern era, whilst some couples opine that parental education programs are pivotal for rearing children, opponents argue that they are unnecessary because it is an innate skill. (O) However, in my opinion, these workshops are quintessential to nurturing psychologically stable youths.", "annotations": [{"code": "R", "label": "Rephrase", "note": "Swaps 'parents' with 'couples', 'take courses' with 'parental education programs are pivotal'."}, {"code": "O", "label": "Opinion", "note": "Clear thesis stating workshops are quintessential to nurturing psychologically stable youths."}]}, {"type": "Body 1 (TEXS)", "content": "(T) To embark on, parenting classes play an imperative role because they develop communication skills between mothers and fathers and their infants. (E) This means that if parents attend professional discipline workshops, these classes will bridge the generation gap between guardians and their dependents and help caretakers understand the emotional needs of their juveniles based on their age group. (X) An eminent example is that Denmark and Sweden have been ranked as the best places in the world to raise children because of their child-rearing parenting educational courses. (S) As a result, what can be said is that parenting skills have a considerable influence on most aspects of a child's development.", "annotations": [{"code": "T", "label": "Topic Sentence", "note": "Direct argument on communication skills."}, {"code": "E", "label": "Explanation", "note": "Elaborates on bridging the generation gap and emotional needs."}, {"code": "X", "label": "eXample", "note": "Scandinavian child-rearing ranking example."}, {"code": "S", "label": "Significance / Cleft", "note": "'What can be said is that...' cleft sentence synthesis."}]}, {"type": "Body 2 (TEXS)", "content": "(T) Moreover, these sessions help parents to know how to safeguard their sons and daughters from the detrimental effects of cultural impacts and social media. (E) In other words, when custodians attend such courses, they will know how to curtail the risk of child abuse, whether sexually or emotionally, by any offender. (X) For example, a research study conducted by Washington University emphasizes that parenting programs lessen child exploitation and negative externalizing behaviors such as delinquency. (S) Thus, not only is caregiver training pivotal for improving the mental health of offspring, but also it is crucial for parent-child interactions.", "annotations": [{"code": "T", "label": "Topic Sentence", "note": "Safeguarding children from social media and cultural threats."}, {"code": "E", "label": "Explanation", "note": "Curtailing risks of emotional and physical exploitation."}, {"code": "X", "label": "eXample", "note": "Washington University research study citation."}, {"code": "S", "label": "Significance / Inversion", "note": "Inverted syntactic structure: 'not only is caregiver training pivotal..., but also it is crucial...'."}]}, {"type": "Conclusion (SO)", "content": "(S) In conclusion, by highlighting the above-mentioned points, it can be reiterated that educational upbringing programs have beneficial consequences on raising future adolescents. (O) Moreover, definitely the authorities should obligate parents to join such programs before they plan to beget a newborn.", "annotations": [{"code": "S", "label": "Summary", "note": "Reiterates the beneficial consequences on future adolescents."}, {"code": "O", "label": "Final Recommendation", "note": "Governments should obligate prospective parents to attend before childbirth."}]}], "synonyms": [{"word": "Imperative", "synonym": "Major / Vital", "role": "Elevates 'important'"}, {"word": "Discipline", "synonym": "Coaching / Training", "role": "Replaces generic 'learning'"}, {"word": "Guardians / Custodians", "synonym": "Parents", "role": "Avoids repetitive 'parents'"}, {"word": "Delinquency", "synonym": "Misbehavior / Disregarding", "role": "Academic psychological term"}, {"word": "Beget", "synonym": "Have / Give birth to", "role": "Rare Band 8+ verb"}, {"word": "Quintessential", "synonym": "Crucial / Prime", "role": "High-tier adjective"}, {"word": "Innate", "synonym": "Inborn / Instinctive", "role": "Accurate biological term"}, {"word": "Exploitation", "synonym": "Misuse / Abuse", "role": "Precise legal noun"}, {"word": "Offspring / Juveniles", "synonym": "Children", "role": "Academic terminology"}, {"word": "Detrimental", "synonym": "Harmful / Damaging", "role": "Replaces simple 'bad'"}, {"word": "Curtail", "synonym": "Reduce / Restrict", "role": "Formal transitive verb"}, {"word": "Pivotal", "synonym": "Essential / Central", "role": "Key linking adjective"}]}, "task1GeneralLetters": [{"recipient": "City Council", "type": "Formal (F)", "salutation": "Dear Sir or Madam,", "signOff": "Yours faithfully,", "toneRules": "Strictly objective, passive voice, no emotional language, zero contractions."}, {"recipient": "Company Owner", "type": "Formal (F)", "salutation": "Dear Mr. / Ms. [Last Name],", "signOff": "Yours sincerely,", "toneRules": "Professional, respectful, concise business register."}, {"recipient": "R   <!-- Presentation Logic Engine -->
  <script>
    (function() {
      const data = window.COURSE_DATA;
      const urlParams = new URLSearchParams(window.location.search);
      let currentWeek = urlParams.get('week') || '1';
      let currentSlideIdx = 0;

      // DOM Elements
      const slideContentInner = document.getElementById('slideContentInner');
      const slideReferencedFilesBar = document.getElementById('slideReferencedFilesBar');
      const currentSlideNumEl = document.getElementById('currentSlideNum');
      const totalSlidesNumEl = document.getElementById('totalSlidesNum');
      const slideProgressBar = document.getElementById('slideProgressBar');
      const weekBadgeLabel = document.getElementById('weekBadgeLabel');
      const slideCategoryLabel = document.getElementById('slideCategoryLabel');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      const weekSelectorBar = document.getElementById('weekSelectorBar');
      const gridItemsContainer = document.getElementById('gridItemsContainer');
      const notesContentText = document.getElementById('notesContentText');
      const slideDotsContainer = document.getElementById('slideDotsContainer');

      const weekNames = {
        '0': 'الأسبوع 0 (التأسيس والجدول)',
        '1': 'الأسبوع 1 (التأسيس والأخطاء القاتلة)',
        '2': 'الأسبوع 2 (معايير التحدث و WHTFM)',
        '3': 'الأسبوع 3 (كتابة Task 2 ومنظومة CHIPSET)',
        '4': 'الأسبوع 4 (التقارير Task 1 والخطابات)',
        '5': 'الأسبوع 5 (الاستماع المتقدم وتكنيك 1.25x)',
        '6': 'الأسبوع 6 (القراءة وتكنيك 15-20-25)',
        '7': 'الأسبوع 7 (المحاكاة الشاملة 3 ساعات)'
      };

      // Render Week Selector Bar
      function renderWeekSelector() {
        weekSelectorBar.innerHTML = Object.keys(data.weeklySlides).map(wKey => {
          const isSelected = (wKey === currentWeek);
          return `
            <button onclick="switchWeek('${wKey}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
              isSelected
                ? 'bg-gradient-to-r from-[#FF602F] to-[#E54917] text-white shadow-md'
                : 'bg-slate-100 hover:bg-slate-200 dark:bg-[#161F32] dark:hover:bg-[#23314D] text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-[#23314D]'
            }">
              الأسبوع ${wKey}
            </button>
          `;
        }).join('');
      }

      // Switch to another week
      window.switchWeek = function(wKey) {
        currentWeek = wKey;
        currentSlideIdx = 0;
        renderWeekSelector();
        renderSlide();
        // Update URL query param without reload
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('week', wKey);
        window.history.pushState({}, '', newUrl);
      };

      // Render Active Slide
      function renderSlide() {
        const slides = data.weeklySlides[currentWeek] || [];
        if (!slides.length) {
          slideContentInner.innerHTML = '<div class="text-center py-12 text-slate-400">لا توجد شرائح متاحة لهذا الأسبوع.</div>';
          return;
        }

        if (currentSlideIdx >= slides.length) currentSlideIdx = slides.length - 1;
        if (currentSlideIdx < 0) currentSlideIdx = 0;

        const s = slides[currentSlideIdx];
        const files = (data.weekFiles && data.weekFiles[currentWeek]) || [];
        const primaryFile = s.primaryFile || (files.length > 0 ? files[0] : null);

        // Update Top Meta
        currentSlideNumEl.textContent = currentSlideIdx + 1;
        totalSlidesNumEl.textContent = slides.length;
        weekBadgeLabel.textContent = `WEEK ${currentWeek}`;
        slideCategoryLabel.textContent = s.category || 'ماستر كلاس';
        slideProgressBar.style.width = `${((currentSlideIdx + 1) / slides.length) * 100}%`;

        btnPrev.disabled = (currentSlideIdx === 0);
        btnNext.disabled = (currentSlideIdx === slides.length - 1);

        // Render Slide Indicators Dots
        slideDotsContainer.innerHTML = slides.map((_, i) => `
          <div onclick="jumpToSlide(${i})" class="cursor-pointer transition-all rounded-full ${
            i === currentSlideIdx
              ? 'w-6 h-2 bg-[#FF602F]'
              : 'w-2 h-2 bg-slate-300 dark:bg-slate-700 hover:bg-[#FFBC18]'
          }"></div>
        `).join('');

        // Build Primary Source Material Card HTML
        let primaryFileHtml = '';
        if (primaryFile) {
          primaryFileHtml = `
            <div class="mb-5 p-4 rounded-2xl bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-transparent border border-[#FF602F]/40 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xs">
              <div class="flex items-start sm:items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#FF602F] to-[#FFBC18] text-white flex items-center justify-center text-lg shrink-0 shadow-sm">
                  <i class="fa-solid ${primaryFile.type === 'PNG' ? 'fa-image' : 'fa-file-pdf'}"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#FF602F]/20 text-[#FF602F] border border-[#FF602F]/30">
                      <i class="fa-solid fa-link"></i> المستند الأصلي المشروح في هذه الشريحة
                    </span>
                    <span class="text-[10px] font-mono text-slate-400">(${primaryFile.size || 'PDF'})</span>
                  </div>
                  <h4 class="font-bold text-slate-900 dark:text-white text-xs sm:text-sm mt-0.5">
                    ${primaryFile.name}
                  </h4>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight mt-0.5">
                    ${primaryFile.desc || 'ملف المنهج المعتمد الخاص بالحصة والتطبيقات'}
                  </p>
                </div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button type="button" onclick="openCoursePdfModal('${primaryFile.path.replace(/'/g, "\\'")}', '${primaryFile.name.replace(/'/g, "\\'")}', '${(primaryFile.desc || '').replace(/'/g, "\\'")}')" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-[#FF602F] to-[#E54917] hover:brightness-110 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition-all cursor-pointer">
                  <i class="fa-solid fa-eye text-[10px]"></i>
                  <span>معاينة المستند</span>
                </button>
                <a href="${encodeURI(primaryFile.path)}" target="_blank" download="${primaryFile.filename || ''}" class="px-3 py-2 rounded-xl bg-slate-200 dark:bg-[#23314D] hover:bg-[#FFBC18] hover:text-slate-900 text-slate-800 dark:text-white font-bold text-xs flex items-center gap-1.5 transition-all text-decoration-none">
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                  <span>فتح / تنزيل</span>
                </a>
              </div>
            </div>
          `;
        }

        // Render Slide HTML
        slideContentInner.innerHTML = `
          <div>
            <!-- Header Row: Category Badge & Slide Step -->
            <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
              <span class="px-3 py-1 rounded-full text-xs font-bold bg-[#FF602F]/15 border border-[#FF602F] text-[#FF602F] flex items-center gap-1.5">
                <i class="fa-solid fa-bolt"></i> ${s.category || 'ماستر كلاس'}
              </span>
              <span class="text-xs font-mono text-slate-500 dark:text-slate-400 font-bold">
                SLIDE ${currentSlideIdx + 1} / ${slides.length}
              </span>
            </div>

            <!-- Slide Title & Subtitle -->
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white leading-tight mb-1">
              ${s.title}
            </h1>
            <div class="text-xs sm:text-sm font-semibold text-[#FFBC18] mb-4">
              ${s.subtitle || ''}
            </div>

            <!-- Prominent Primary Document Launcher Card -->
            ${primaryFileHtml}

            <!-- Main Slide Content (Rich Content) -->
            <div class="text-sm sm:text-base text-slate-700 dark:text-slate-200 leading-relaxed mb-6 space-y-3 ar-text">
              ${s.content}
            </div>
          </div>

          <!-- Bottom Strategy Boxes (Live Discussion + Formula) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-200/80 dark:border-[#23314D]">
            ${s.discussionTopic ? `
              <div class="p-4 rounded-2xl bg-amber-500/10 border border-[#FFBC18]/40 text-xs sm:text-sm">
                <div class="font-bold text-[#FFBC18] mb-1.5 flex items-center gap-1.5">
                  <i class="fa-solid fa-comments"></i> محور ونقاط نقاش الحصة الفعلية (Live Agenda):
                </div>
                <p class="text-slate-700 dark:text-slate-200 leading-relaxed">${s.discussionTopic}</p>
              </div>
            ` : ''}

            ${s.formula ? `
              <div class="p-4 rounded-2xl bg-[#FF602F]/10 border border-[#FF602F]/40 text-xs sm:text-sm relative group">
                <div class="flex items-center justify-between mb-1.5">
                  <div class="font-bold text-[#FF602F] flex items-center gap-1.5">
                    <i class="fa-solid fa-calculator"></i> المعادلة / القاعدة الذهبية:
                  </div>
                  <button onclick="copyText('${s.formula.replace(/'/g, "\'")}')" class="text-[10px] px-2 py-0.5 rounded bg-[#FF602F]/20 text-[#FF602F] hover:bg-[#FF602F] hover:text-white transition-colors" title="نسخ">
                    نسخ
                  </button>
                </div>
                <div class="font-bold text-slate-900 dark:text-white font-mono text-sm leading-relaxed">${s.formula}</div>
              </div>
            ` : ''}
          </div>
        `;

        // Update Coach Notes Drawer text
        if (notesContentText) {
          notesContentText.innerHTML = s.teacherNote ? `
            <div class="flex items-start gap-2">
              <i class="fa-solid fa-lightbulb text-[#FFBC18] mt-1 text-sm"></i>
              <div>
                <strong class="text-slate-900 dark:text-white block mb-2">توجيهات مصححي كامبريدج والمدرب محمود السعيد:</strong>
                <p class="leading-relaxed text-slate-700 dark:text-slate-300">${s.teacherNote}</p>
              </div>
            </div>
          ` : '<p class="text-slate-400">لا توجد ملاحظات إضافية لهذه الشريحة.</p>';
        }

        // Render Bottom Referenced Documents Hub Bar
        if (slideReferencedFilesBar) {
          if (files.length > 0) {
            slideReferencedFilesBar.innerHTML = `
              <div class="flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-300 shrink-0">
                <i class="fa-solid fa-paperclip text-[#FF602F]"></i>
                <span>مستندات الأسبوع المرجعية الكاملة (${files.length} ملفات):</span>
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                ${files.map(f => `
                  <a href="${encodeURI(f.path)}" target="_blank" download="${f.filename || ''}" onclick="event.preventDefault(); openCoursePdfModal('${f.path.replace(/'/g, \\'\')}', '${f.name.replace(/'/g, \\'\')}', '${(f.desc || '').replace(/'/g, \\'\')}');" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white hover:bg-slate-100 dark:bg-[#161F32] dark:hover:bg-[#23314D] border border-slate-200 dark:border-[#23314D] text-xs font-semibold text-slate-700 dark:text-slate-200 transition-all shadow-xs group" title="${f.desc}">
                    <i class="fa-solid ${f.type === 'PNG' ? 'fa-image text-amber-500' : 'fa-file-pdf text-rose-500'} group-hover:scale-110 transition-transform"></i>
                    <span>${f.name}</span>
                    <span class="text-[10px] text-slate-400 font-mono">(${f.size})</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-[#FF602F] ml-1"></i>
                  </a>
                `).join('')}
              </div>
            `;
          } else {
            slideReferencedFilesBar.innerHTML = '<span class="text-slate-400 text-xs">لا توجد ملفات مرفقة لهذا الأسبوع.</span>';
          }
        }
      }

      // Slide Navigation Methods
      window.nextSlide = function() {
        const slides = data.weeklySlides[currentWeek] || [];
        if (currentSlideIdx < slides.length - 1) {
          currentSlideIdx++;
          renderSlide();
        }
      };

      window.prevSlide = function() {
        if (currentSlideIdx > 0) {
          currentSlideIdx--;
          renderSlide();
        }
      };

      window.jumpToSlide = function(idx) {
        currentSlideIdx = idx;
        renderSlide();
        closeGridModal();
      };

      
    // --- In-Page PDF Modal Controller ---
    window.openCoursePdfModal = function(filePath, title, subtitle) {
      const modal = document.getElementById('pdfViewerModal');
      const obj = document.getElementById('pdfModalObject');
      const iframe = document.getElementById('pdfModalIframe');
      const titleEl = document.getElementById('pdfModalTitle');
      const subEl = document.getElementById('pdfModalSubtitle');
      const newTabBtn = document.getElementById('pdfModalNewTabBtn');
      const dlBtn = document.getElementById('pdfModalDownloadBtn');
      const fallbackBtn = document.getElementById('pdfModalFallbackBtn');

      const cleanEncoded = encodeURI(filePath);
      const filename = filePath.split('/').pop();

      if (titleEl) titleEl.textContent = title || filename;
      if (subEl) subEl.textContent = subtitle || 'مستند الآيلتس الأصلي المعتمد';
      if (newTabBtn) newTabBtn.href = cleanEncoded;
      if (dlBtn) {
        dlBtn.href = cleanEncoded;
        dlBtn.setAttribute('download', filename);
      }
      if (fallbackBtn) fallbackBtn.href = cleanEncoded;
      if (obj) obj.data = cleanEncoded + '#toolbar=1';
      if (iframe) iframe.src = cleanEncoded + '#toolbar=1';

      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    };

    window.closePdfModal = function() {
      const modal = document.getElementById('pdfViewerModal');
      const obj = document.getElementById('pdfModalObject');
      const iframe = document.getElementById('pdfModalIframe');
      if (obj) obj.data = '';
      if (iframe) iframe.src = 'about:blank';
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

      // Grid Modal Toggle
      window.toggleGridModal = function() {
        const modal = document.getElementById('gridModal');
        if (modal.classList.contains('hidden')) {
          openGridModal();
        } else {
          closeGridModal();
        }
      };

      function openGridModal() {
        const modal = document.getElementById('gridModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        const slides = data.weeklySlides[currentWeek] || [];
        gridItemsContainer.innerHTML = slides.map((s, idx) => `
          <div onclick="jumpToSlide(${idx})" class="p-4 rounded-2xl border transition-all cursor-pointer ${
            idx === currentSlideIdx
              ? 'bg-[#FF602F]/15 border-[#FF602F] text-[#FF602F]'
              : 'bg-slate-50 dark:bg-[#161F32] hover:bg-slate-100 dark:hover:bg-[#1E293B] border-slate-200 dark:border-[#23314D] text-slate-800 dark:text-slate-200'
          }">
            <div class="flex items-center justify-between text-[11px] font-mono mb-2">
              <span class="font-bold">#${idx + 1}</span>
              <span class="text-xs">${s.category || 'ماستر كلاس'}</span>
            </div>
            <h4 class="font-bold text-xs sm:text-sm line-clamp-2">${s.title}</h4>
          </div>
        `).join('');
      }

      function closeGridModal() {
        const modal = document.getElementById('gridModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      // Coach Notes Drawer Toggle
      window.toggleNotesDrawer = function() {
        const drawer = document.getElementById('notesDrawer');
        drawer.classList.toggle('translate-x-full');
      };

      // Fullscreen Toggle
      window.toggleFullscreen = function() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      };

      // Theme Toggle (Dark / Light)
      window.toggleTheme = function() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('ielts_theme', isDark ? 'dark' : 'light');
        showToast(isDark ? 'تم تفعيل الوضع الداكن 🌙' : 'تم تفعيل الوضع الفاتح ☀️');
      };

      // Toast Notification
      window.showToast = function(msg) {
        const toast = document.getElementById('toastNotification');
        const toastMsg = document.getElementById('toastMessage');
        if (toast && toastMsg) {
          toastMsg.textContent = msg;
          toast.classList.remove('translate-y-20', 'opacity-0');
          setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
          }, 2500);
        }
      };

      // Copy Helper
      window.copyText = function(text) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => {
            showToast('تم نسخ المحتوى بنجاح! 📋');
          });
        }
      };

      window.copySlideFormula = function() {
        const slides = data.weeklySlides[currentWeek] || [];
        const s = slides[currentSlideIdx];
        if (s && s.formula) {
          copyText(s.formula);
        } else {
          showToast('لا توجد معادلة مخصصة في هذه الشريحة');
        }
      };

      // Audio Pronunciation Engine using Web Speech API
      window.speakCurrentSlideText = function() {
        const slides = data.weeklySlides[currentWeek] || [];
        const s = slides[currentSlideIdx];
        if (!s) return;

        // Extract English text from title and formula or content
        let textToSpeak = (s.title + '. ' + (s.formula || '')).replace(/[^␀-]+/g, ' ').trim();
        if (!textToSpeak || textToSpeak.length < 5) {
          textToSpeak = "Band 8.0 Cambridge IELTS Academic Preparation Masterclass.";
        }

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(textToSpeak);
          utterance.lang = 'en-GB';
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
          showToast('🔊 تشغيل النطق الصوتي باللكنة البريطانية...');
        } else {
          showToast('المتصفح لا يدعم التوليد الصوتي المباشر');
        }
      };

      // Countdown Practice Timer
      let timerInterval = null;
      let timerSecondsRemaining = 120;
      let timerRunning = false;

      window.toggleTimerModal = function() {
        const modal = document.getElementById('timerModal');
        modal.classList.toggle('hidden');
        modal.classList.toggle('flex');
      };

      window.setTimerPreset = function(seconds, label) {
        pauseTimer();
        timerSecondsRemaining = seconds;
        updateTimerDisplay();
        showToast(`تم ضبط المؤقت على: ${label}`);
      };

      function updateTimerDisplay() {
        const mins = Math.floor(timerSecondsRemaining / 60).toString().padStart(2, '0');
        const secs = (timerSecondsRemaining % 60).toString().padStart(2, '0');
        const str = `${mins}:${secs}`;
        const practiceEl = document.getElementById('practiceTimerDisplay');
        const headerEl = document.getElementById('headerTimerDisplay');
        if (practiceEl) practiceEl.textContent = str;
        if (headerEl) headerEl.textContent = str;
      }

      window.startTimer = function() {
        if (timerRunning) return;
        timerRunning = true;
        const btn = document.getElementById('btnTimerStart');
        if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> المؤقت يعمل...';
        timerInterval = setInterval(() => {
          if (timerSecondsRemaining > 0) {
            timerSecondsRemaining--;
            updateTimerDisplay();
          } else {
            pauseTimer();
            showToast('⏰ انتهى الوقت المحدد للتدريب!');
          }
        }, 1000);
      };

      window.pauseTimer = function() {
        timerRunning = false;
        clearInterval(timerInterval);
        const btn = document.getElementById('btnTimerStart');
        if (btn) btn.innerHTML = '<i class="fa-solid fa-play"></i> استئناف المؤقت';
      };

      window.resetTimer = function() {
        pauseTimer();
        timerSecondsRemaining = 120;
        updateTimerDisplay();
      };

      // Keyboard Shortcuts Navigation
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' || e.key === 'PageUp') {
          prevSlide(); // RTL navigation
        } else if (e.key === 'ArrowLeft' || e.key === 'PageDown' || e.key === ' ') {
          nextSlide();
        } else if (e.key === 'g' || e.key === 'G') {
          toggleGridModal();
        } else if (e.key === 'n' || e.key === 'N') {
          toggleNotesDrawer();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        } else if (e.key === 't' || e.key === 'T') {
          toggleTimerModal();
        } else if (e.key === 'Escape') {
          closeGridModal();
          const drawer = document.getElementById('notesDrawer');
          if (drawer) drawer.classList.add('translate-x-full');
          const timerModal = document.getElementById('timerModal');
          if (timerModal) timerModal.classList.add('hidden');
        }
      });

      // Init Theme from LocalStorage
      const savedTheme = localStorage.getItem('ielts_theme') || 'dark';
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }

      // Init Lifecycle
      renderWeekSelector();
      renderSlide();
      updateTimerDisplay();

    })();
  </script>

  <!-- In-Page Embedded PDF Document Viewer Modal -->
  <div id="pdfViewerModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/85 backdrop-blur-md p-3 sm:p-6" onclick="if(event.target.id==='pdfViewerModal') closePdfModal();">
    <div class="relative w-full max-w-5xl h-[90vh] bg-white dark:bg-[#111726] rounded-3xl border border-slate-200 dark:border-[#23314D] shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <!-- Modal Header -->
      <div class="px-5 py-3.5 border-b border-slate-200 dark:border-[#23314D] flex items-center justify-between bg-slate-50 dark:bg-[#161F32]">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-rose-500/15 text-rose-500 flex items-center justify-center text-base shrink-0">
            <i class="fa-solid fa-file-pdf"></i>
          </div>
          <div class="min-w-0">
            <h3 id="pdfModalTitle" class="font-bold text-slate-900 dark:text-white text-xs sm:text-sm truncate"></h3>
            <p id="pdfModalSubtitle" class="text-[11px] text-slate-400 truncate"></p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <a id="pdfModalNewTabBtn" href="#" target="_blank" rel="noopener" class="px-3.5 py-1.5 rounded-xl bg-slate-200 dark:bg-[#23314D] hover:bg-[#FF602F] hover:text-white text-xs font-bold transition-all flex items-center gap-1.5 text-slate-800 dark:text-white">
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            <span>نافذة مستقلة</span>
          </a>
          <a id="pdfModalDownloadBtn" href="#" download class="px-3.5 py-1.5 rounded-xl bg-[#FF602F] text-white hover:brightness-110 text-xs font-bold transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-download text-[10px]"></i>
            <span>تنزيل</span>
          </a>
          <button onclick="closePdfModal()" class="w-8 h-8 rounded-xl bg-slate-200 dark:bg-[#23314D] hover:bg-rose-500 hover:text-white text-xs flex items-center justify-center transition-all ml-1 text-slate-700 dark:text-slate-200">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>
      <!-- Modal Viewer Body -->
      <div class="flex-1 w-full h-full bg-slate-100 dark:bg-black/50 relative overflow-hidden flex items-center justify-center">
        <object id="pdfModalObject" data="" type="application/pdf" class="w-full h-full">
          <iframe id="pdfModalIframe" src="" class="w-full h-full border-0"></iframe>
          <div class="text-center p-8 text-slate-600 dark:text-slate-300">
            <p class="mb-4 text-sm font-semibold">إذا لم يظهر ملف PDF داخل الإطار، يمكنك فتحه مباشرة بالزر أدناه:</p>
            <a id="pdfModalFallbackBtn" href="#" target="_blank" class="px-5 py-2.5 rounded-xl bg-[#FF602F] text-white font-bold text-sm inline-flex items-center gap-2 shadow-lg">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
              <span>فتح المستند الآن</span>
            </a>
          </div>
        </object>
      </div>
    </div>
  </div>

</body>
</html>
